---
name: QA Tests

on:
  pull_request:
    branches: [develop, beta]
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_OPTIONS: '--max-old-space-size=4096 --experimental-vm-modules'
  CI: true

jobs:
  qa-tests:
    name: QA Automated Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build project
        run: npm run build

      - name: Verify QA scripts exist
        shell: bash
        run: |
          for script in \
            scripts/qa-mcp-mode-contract.js \
            scripts/qa-server-bootstrap.js \
            scripts/qa-direct-test.js \
            scripts/qa-inspector-cli-test.js
          do
            if [ ! -f "$script" ]; then
              echo "Missing required QA script: $script"
              exit 1
            fi
          done

          mkdir -p docs/QA
          echo "QA mode-matrix scripts and results directory are ready"

      - name: Run QA mode matrix
        id: qa_tests
        continue-on-error: true
        shell: bash
        run: |
          set +e
          timeout --kill-after=10s 300s npm run qa:direct
          direct_code=$?

          timeout --kill-after=10s 300s npm run qa:inspector
          inspector_code=$?
          set -e

          if [ "$direct_code" -eq 0 ]; then
            direct_status=success
          elif [ "$direct_code" -eq 124 ]; then
            direct_status=timeout
          else
            direct_status=failed
          fi

          if [ "$inspector_code" -eq 0 ]; then
            inspector_status=success
          elif [ "$inspector_code" -eq 124 ]; then
            inspector_status=timeout
          else
            inspector_status=failed
          fi

          if [ "$direct_code" -eq 0 ] && [ "$inspector_code" -eq 0 ]; then
            qa_status=success
          else
            qa_status=failed
          fi

          echo "direct_status=$direct_status" >> "$GITHUB_OUTPUT"
          echo "inspector_status=$inspector_status" >> "$GITHUB_OUTPUT"
          echo "qa_status=$qa_status" >> "$GITHUB_OUTPUT"

          echo "Direct SDK status: $direct_status"
          echo "Inspector CLI status: $inspector_status"

          if [ "$qa_status" != success ]; then
            exit 1
          fi

      - name: Verify test results
        id: qa_results
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          status=0
          for runner in direct inspector
          do
            latest_result=$(find docs/QA -maxdepth 1 -type f \
              -name "qa-${runner}-test-results-*.json" -printf '%T@ %p\n' \
              | sort -nr | head -1 | cut -d' ' -f2-)

            if [ -z "$latest_result" ]; then
              echo "No $runner QA result was produced"
              status=1
              continue
            fi

            echo "$runner report: $latest_result"
            jq '.summary' "$latest_result"
            if ! jq -e '.summary.failed_tests == 0' "$latest_result" > /dev/null; then
              echo "$runner report contains failed checks"
              status=1
            fi
          done

          exit "$status"

      - name: Upload QA test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-test-results-${{ github.run_number }}
          path: docs/QA/qa-*-test-results-*.json
          retention-days: 30
          if-no-files-found: warn

      - name: Upload QA test logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-test-logs-${{ github.run_number }}
          path: |
            docs/QA/*.md
            docs/QA/agent-reports/*.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Write QA results summary
        if: always()
        shell: bash
        run: |
          {
            echo "## MCP QA mode matrix"
            echo
            echo "- Overall runner status: ${{ steps.qa_tests.outputs.qa_status || 'unknown' }}"
            echo "- Direct SDK: ${{ steps.qa_tests.outputs.direct_status || 'unknown' }}"
            echo "- Inspector CLI: ${{ steps.qa_tests.outputs.inspector_status || 'unknown' }}"
            echo "- Report validation: ${{ steps.qa_results.outcome }}"
            echo
            echo "This non-blocking job validates discrete, MCP-AQL CRUDE, and MCP-AQL single modes."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce QA result within the non-blocking job
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.qa_tests.outputs.qa_status }}" != success ]; then
            echo "One or more QA runners failed or timed out"
            exit 1
          fi

          if [ "${{ steps.qa_results.outcome }}" != success ]; then
            echo "QA report validation failed"
            exit 1
          fi

          echo "All three interface modes passed through both QA clients"
