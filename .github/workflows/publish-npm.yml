name: Publish to npm

# This workflow publishes the package to npm registry when a release is published.
# Uses npm Trusted Publishing (OIDC) for secure, token-free authentication.
#
# Trusted Publishing Setup Required for both @dollhousemcp/mcp-server and
# @dollhousemcp/safety:
# 1. Open each package's settings on npmjs.com.
# 2. Add the same Trusted Publisher to each package:
#    - Provider: GitHub Actions
#    - Organization: DollhouseMCP
#    - Repository: mcp-server
#    - Workflow: publish-npm.yml
#    - Environment: (leave blank)
#    - Allowed action: npm publish
#
# The safety package job completes before the server package job. Existing
# safety versions are skipped so server-only releases remain idempotent.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run in dry-run mode (test without publishing)'
        required: false
        type: boolean
        default: true
      safety_only:
        description: 'Publish only safety from an exact trusted main commit'
        required: false
        type: boolean
        default: false
      safety_source_sha:
        description: 'Required exact main commit SHA when safety_only is true'
        required: false
        type: string
      debug_oidc:
        description: 'Print sanitized npm/OIDC availability diagnostics'
        required: false
        type: boolean
        default: false

concurrency:
  group: release-publish-${{ github.workflow }}
  cancel-in-progress: false

env:
  NODE_OPTIONS: '--max-old-space-size=4096'
  CI: true

jobs:
  publish-safety:
    name: Publish safety package
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Guard safety-only source
        shell: bash
        env:
          SAFETY_ONLY: ${{ inputs.safety_only || false }}
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_REF: ${{ github.ref }}
          SOURCE_SHA: ${{ github.sha }}
          EXPECTED_SHA: ${{ inputs.safety_source_sha }}
        run: |
          if [[ "$SAFETY_ONLY" != "true" ]]; then exit 0; fi
          if [[ "$EVENT_NAME" != "workflow_dispatch" || "$SOURCE_REPOSITORY" != "DollhouseMCP/mcp-server" || "$SOURCE_REF" != "refs/heads/main" ]]; then
            echo "::error::Safety-only publication requires a manual dispatch from trusted main."
            exit 1
          fi
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ || "$EXPECTED_SHA" != "$SOURCE_SHA" || "$(git rev-parse HEAD)" != "$EXPECTED_SHA" ]]; then
            echo "::error::Safety-only publication requires the exact requested main commit."
            exit 1
          fi
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if [[ "$(git rev-parse refs/remotes/origin/main)" != "$EXPECTED_SHA" ]]; then
            echo "::error::Trusted main advanced; review the new source before dispatching again."
            exit 1
          fi

      - name: Setup Node.js for npm
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
          cache-dependency-path: packages/safety/package-lock.json
        env:
          NODE_AUTH_TOKEN: ''

      - name: Install safety package dependencies
        working-directory: packages/safety
        run: npm ci --ignore-scripts --workspaces=false

      - name: Build safety package
        working-directory: packages/safety
        run: npm run build

      - name: Check safety package version
        id: safety_version
        shell: bash
        run: |
          VERSION=$(node -p "require('./packages/safety/package.json').version")
          REQUIRED_RANGE=$(node -p "require('./package.json').dependencies['@dollhousemcp/safety']")
          EXPECTED_RANGE="^$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if [ "$REQUIRED_RANGE" != "$EXPECTED_RANGE" ]; then
            echo "::error::Safety workspace version $VERSION does not match the server dependency floor ($REQUIRED_RANGE). Expected $EXPECTED_RANGE."
            exit 1
          fi

          for ATTEMPT in 1 2 3; do
            if LOOKUP_OUTPUT=$(npm view "@dollhousemcp/safety@$VERSION" version 2>&1); then
              echo "needs_publish=false" >> "$GITHUB_OUTPUT"
              echo "@dollhousemcp/safety@$VERSION is already published; skipping."
              exit 0
            fi

            if printf '%s\n' "$LOOKUP_OUTPUT" | grep -Eq '(^|[[:space:]])E404([[:space:]]|$)|404 Not Found|No match found for version'; then
              echo "needs_publish=true" >> "$GITHUB_OUTPUT"
              echo "@dollhousemcp/safety@$VERSION is not published yet."
              exit 0
            fi

            if [ "$ATTEMPT" -lt 3 ]; then
              sleep $((ATTEMPT * 2))
            fi
          done

          echo "::error::Unable to verify @dollhousemcp/safety@$VERSION in the npm registry after 3 attempts."
          exit 1

      - name: Publish safety package (with provenance)
        if: github.event.inputs.dry_run != 'true' && steps.safety_version.outputs.needs_publish == 'true'
        working-directory: packages/safety
        env:
          NPM_CONFIG_PROVENANCE: 'true'
        run: npm publish --provenance --access public --loglevel verbose

      - name: Dry run safety package
        # Intentionally runs even when the version is already published so the
        # complete package lifecycle is exercised on demand.
        if: github.event.inputs.dry_run == 'true'
        working-directory: packages/safety
        shell: bash
        run: |
          # npm 11 rejects --dry-run for a version that already exists. Use a
          # run-local version so the complete publish lifecycle remains testable.
          npm pkg set "version=0.0.0-dry-run.${GITHUB_RUN_ID}"
          npm publish --dry-run --tag dry-run

  publish-npm:
    name: Publish to npm Registry
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.safety_only != true }}
    needs: publish-safety
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js for npm
        uses: actions/setup-node@v4
        with:
          # Node 24.x ships with npm 11.x — REQUIRED for OIDC Trusted Publishing.
          # npm 10.x (Node 22) does not support the OIDC handshake and fails with
          # ENEEDAUTH or a misleading E404. npm 11 is the minimum supported version.
          node-version: '24.x'
          # registry-url is required so setup-node creates .npmrc pointing at the
          # registry. NODE_AUTH_TOKEN is explicitly cleared below so that setup-node
          # does not inject GITHUB_TOKEN as the npm auth credential, which would
          # conflict with OIDC Trusted Publishing.
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
        env:
          # CRITICAL: setup-node v4 defaults NODE_AUTH_TOKEN to GITHUB_TOKEN when
          # registry-url is set. Clearing it lets npm fall through to OIDC auth.
          NODE_AUTH_TOKEN: ''

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build project
        run: npm run build

      # Note: Tests are skipped in publish workflow because:
      # 1. Tests already run in core-build-test workflow before any merge to main
      # 2. jsdom ESM compatibility issue causes false failures in isolated environments
      # 3. This workflow only runs after code has passed all CI checks

      - name: Check package version
        id: package_version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing version: $VERSION"

      - name: Resolve npm dist-tag
        id: npm_dist_tag
        shell: bash
        env:
          PACKAGE_VERSION: ${{ steps.package_version.outputs.version }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease || false }}
        run: |
          case "${PACKAGE_VERSION}" in
            *-alpha.*)
              dist_tag="alpha"
              ;;
            *-beta|*-beta.*)
              dist_tag="beta"
              ;;
            *-rc.*)
              dist_tag="rc"
              ;;
            *-*)
              echo "::error::Unsupported prerelease channel in ${PACKAGE_VERSION}; expected -alpha., -beta, -beta., or -rc."
              exit 1
              ;;
            *)
              dist_tag="latest"
              ;;
          esac

          if [[ "${EVENT_NAME}" == "release" && "${RELEASE_PRERELEASE}" == "true" && "${dist_tag}" == "latest" ]]; then
            echo "::error::Refusing to publish a GitHub prerelease to npm latest"
            exit 1
          fi

          if [[ "${EVENT_NAME}" == "release" && "${RELEASE_PRERELEASE}" != "true" && "${dist_tag}" != "latest" ]]; then
            echo "::error::Prerelease version ${PACKAGE_VERSION} must be published from a GitHub prerelease"
            exit 1
          fi

          echo "dist_tag=${dist_tag}" >> "$GITHUB_OUTPUT"
          echo "npm dist-tag: ${dist_tag}"

      - name: Debug OIDC Environment
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.debug_oidc == true }}
        shell: bash
        run: |
          npm --version
          if [[ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" && -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]]; then
            echo "OIDC request credentials are available."
          else
            echo "OIDC request credentials are unavailable."
          fi
          if [[ -n "${NODE_AUTH_TOKEN:-}" ]]; then
            echo "NODE_AUTH_TOKEN is set; check that token authentication is intentional."
          else
            echo "NODE_AUTH_TOKEN is unset."
          fi

      - name: Publish to npm (with provenance)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run != true }}
        shell: bash
        env:
          # Ensure provenance is enabled for OIDC detection
          NPM_CONFIG_PROVENANCE: 'true'
          DIST_TAG: ${{ steps.npm_dist_tag.outputs.dist_tag }}
        run: |
          # Publish with provenance via OIDC Trusted Publishing.
          # Requires: npm 11+ (Node 24), id-token: write, NODE_AUTH_TOKEN cleared,
          # and a Trusted Publisher configured at npmjs.com/package/@dollhousemcp/mcp-server/access
          npm publish --provenance --access public --tag "${DIST_TAG}" --loglevel verbose

      - name: Dry run (skip publish)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}
        shell: bash
        env:
          DIST_TAG: ${{ steps.npm_dist_tag.outputs.dist_tag }}
        run: |
          echo "🧪 DRY RUN MODE - Skipping publication"
          echo "Package would be published: @dollhousemcp/mcp-server@${{ steps.package_version.outputs.version }} with npm dist-tag ${DIST_TAG}"
          # npm 11 rejects an already-published version even for --dry-run.
          # Keep the temporary version on its original channel so prepublishOnly
          # exercises the same guard as a real publish, without a bypass.
          case "${DIST_TAG}" in
            latest) dry_run_version="0.0.${GITHUB_RUN_ID}" ;;
            alpha|beta) dry_run_version="0.0.0-${DIST_TAG}.dry-run.${GITHUB_RUN_ID}" ;;
            rc) dry_run_version="0.0.0-rc.dry-run.${GITHUB_RUN_ID}" ;;
            *) echo "::error::Unsupported dry-run channel: ${DIST_TAG}"; exit 1 ;;
          esac
          npm pkg set "version=${dry_run_version}"
          npm publish --dry-run --tag "${DIST_TAG}"

      - name: Verify latest dist-tag integrity
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run != true }}
        shell: bash
        run: |
          # Post-publish invariant: `latest` must NEVER point at a prerelease.
          # Every default install path (npx @dollhousemcp/mcp-server, bare
          # npm install, and the @latest pin our installer writes into client
          # configs) resolves through this dist-tag — including installs by
          # users on OLD versions that predate any client-side checks. If a
          # prerelease ever lands on `latest` (manual publish without --tag,
          # registry hiccup), stable users would silently update onto beta.
          sleep 10  # allow registry propagation before reading back
          LATEST=$(npm view @dollhousemcp/mcp-server dist-tags.latest 2>/dev/null || echo "")
          echo "npm dist-tags.latest resolves to: ${LATEST:-<unreadable>}"
          if [[ -z "${LATEST}" ]]; then
            echo "::warning::Could not read back dist-tags.latest (registry propagation delay?) — verify manually"
            exit 0
          fi
          if [[ "${LATEST}" == *-* ]]; then
            echo "::error::dist-tags.latest points at a PRERELEASE (${LATEST}). Stable users installing via npx/@latest will receive it. Repair immediately:"
            echo "::error::  npm dist-tag add @dollhousemcp/mcp-server@<highest-stable-version> latest"
            exit 1
          fi
          echo "✅ latest dist-tag integrity OK (${LATEST} is a stable version)"

      - name: Notify success
        if: ${{ success() && (github.event_name != 'workflow_dispatch' || inputs.dry_run != true) }}
        shell: bash
        run: |
          echo "✅ Successfully published @dollhousemcp/mcp-server@${{ steps.package_version.outputs.version }} to npm!"
          echo "🏷️ Dist-tag: ${{ steps.npm_dist_tag.outputs.dist_tag }}"
          echo "📦 View at: https://www.npmjs.com/package/@dollhousemcp/mcp-server/v/${{ steps.package_version.outputs.version }}"
