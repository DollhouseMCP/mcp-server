---
name: Core Build & Test
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  NODE_OPTIONS: '--max-old-space-size=6144 --experimental-vm-modules'
  CI: true
  PORTFOLIO_REPOSITORY_NAME: dollhouse-portfolio
  DIAG_TARGET_ROOT: ${{ github.workspace }}/target
  DIAG_TOOL_ROOT: ${{ github.workspace }}/diagnostic-tool
  DIAG_OUTPUT: ${{ runner.temp }}/macos-performance-diagnostic
  TEST_PERSONAS_DIR: ${{ github.workspace }}/target/test-personas
jobs:
  diagnostic:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/fix/beta3-macos-performance-diagnostic-20261103' && github.run_attempt == 1
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Checkout diagnostic tools
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: diagnostic-tool
          fetch-depth: 1
          persist-credentials: false
      - name: Checkout fixed target
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 4f20b5790d5a7b1c28a698e25796c7aa641c68b5
          path: target
          fetch-depth: 1
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        with:
          node-version: 20.20.2
          cache: npm
          cache-dependency-path: target/package-lock.json
      - name: Admit source and host
        id: admission
        run: python3 "$DIAG_TOOL_ROOT/scripts/diagnostics/macos-performance/host.py" before
      - name: Install dependencies
        working-directory: target
        run: npm ci --ignore-scripts
      - name: Build target
        working-directory: target
        run: npm run build
      - name: Clear Jest cache
        working-directory: target
        run: node node_modules/jest/bin/jest.js --clearCache
      - name: Run full performance suite once
        run: python3 "$DIAG_TOOL_ROOT/scripts/diagnostics/macos-performance/launch.py"
      - name: Record host after diagnostic
        if: always() && steps.admission.outcome == 'success'
        run: python3 "$DIAG_TOOL_ROOT/scripts/diagnostics/macos-performance/host.py" after
      - name: Upload bounded diagnostic facts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: macos-performance-diagnostic
          path: |
            ${{ runner.temp }}/macos-performance-diagnostic/admission.json
            ${{ runner.temp }}/macos-performance-diagnostic/host-after.json
            ${{ runner.temp }}/macos-performance-diagnostic/performance-receipt.json
            ${{ runner.temp }}/macos-performance-diagnostic/phases.json
            ${{ runner.temp }}/macos-performance-diagnostic/jest-results.json
            ${{ runner.temp }}/macos-performance-diagnostic/stdout.txt
            ${{ runner.temp }}/macos-performance-diagnostic/stderr.txt
          retention-days: 7
          if-no-files-found: warn
