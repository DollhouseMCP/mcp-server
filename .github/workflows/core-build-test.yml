---
name: Core Build & Test

on:
  push:
    branches: [main, develop, beta]
  pull_request:
    branches: [main, develop, beta]
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_OPTIONS: '--max-old-space-size=6144 --experimental-vm-modules'
  CI: true
  PORTFOLIO_REPOSITORY_NAME: dollhouse-portfolio
  TEST_GITHUB_TOKEN: ${{ secrets.TEST_GITHUB_TOKEN }}

jobs:
  hosted-test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: ['20.x']

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          fetch-tags: true
          persist-credentials: true

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Set cross-platform TEST_PERSONAS_DIR
        shell: bash
        run: |
          # Use Node.js to create proper cross-platform path with escaped quotes for shell safety
          TEST_PERSONAS_DIR=$(node -e "console.log(require('path').join(process.argv[1], 'test-personas'))" "${{ github.workspace }}")
          echo "TEST_PERSONAS_DIR=$TEST_PERSONAS_DIR" >> $GITHUB_ENV
          echo "Set TEST_PERSONAS_DIR to: $TEST_PERSONAS_DIR"

      - name: Validate environment
        # Use bash for cross-platform compatibility (Windows/macOS/Linux)
        shell: bash
        run: |
          echo "🔍 Validating CI environment..."
          echo "TEST_PERSONAS_DIR: $TEST_PERSONAS_DIR"
          echo "NODE_OPTIONS: $NODE_OPTIONS"
          echo "CI: $CI"

          # Verify TEST_PERSONAS_DIR is set
          if [ -z "$TEST_PERSONAS_DIR" ]; then
            echo "❌ TEST_PERSONAS_DIR is not set!"
            exit 1
          fi

          # Display workspace info for debugging
          echo "GitHub workspace: ${{ github.workspace }}"
          echo "Runner OS: ${{ runner.os }}"
          echo "Current directory: $(pwd)"

          echo "✅ Environment validation passed"

      # Temporarily disabled TypeScript cache to debug CI issues
      # - name: Cache TypeScript build
      #   uses: actions/cache@v4
      #   with:
      #     path: |
      #       dist/
      #       build/
      #       *.tsbuildinfo
      #     key: typescript-build-${{ runner.os }}-${{ matrix.node-version }}-${{ hashFiles('src/**/*.ts', 'tsconfig*.json', 'package.json', 'package-lock.json') }}
      #     restore-keys: |
      #       typescript-build-${{ runner.os }}-${{ matrix.node-version }}-
      #       typescript-build-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build project
        run: npm run build

      - name: Debug file structure
        shell: bash
        run: |
          echo "=== Current directory ==="
          pwd
          echo "=== Node version ==="
          node --version
          echo "=== NPM version ==="
          npm --version
          echo "=== Root files ==="
          if ls jest.* >/dev/null 2>&1; then ls jest.*; else echo "No jest files found"; fi
          echo "=== Source files ==="
          if [ -d "src/update/" ]; then ls src/update/; else echo "src/update not found"; fi
          echo "=== Config files ==="
          if [ -d "src/config/" ]; then ls src/config/; else echo "src/config not found"; fi
          echo "=== Dist files ==="
          if [ -d "dist/update/" ]; then ls dist/update/; else echo "dist/update not found"; fi
          echo "=== Test files ==="
          if [ -d "tests/unit/auto-update/" ]; then ls tests/unit/auto-update/; else echo "auto-update tests not found"; fi
          echo "=== NODE_PATH ==="
          echo $NODE_PATH
          echo "=== Jest config ==="
          if [ -f "tests/jest.config.cjs" ]; then cat tests/jest.config.cjs; else echo "Jest config not found"; fi

      - name: Cache Jest
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            .jest-cache/
            tests/coverage/
            node_modules/.cache/jest/
          key: jest-cache-${{ runner.os }}-${{ matrix.node-version }}-${{ hashFiles('tests/**/*.ts', 'tests/jest.config.*', 'src/**/*.ts', 'package.json', 'package-lock.json') }}
          restore-keys: |
            jest-cache-${{ runner.os }}-${{ matrix.node-version }}-
            jest-cache-${{ runner.os }}-

      - name: Clear Jest cache
        run: node node_modules/jest/bin/jest.js --clearCache

      - name: Run test suite (original method)
        id: original_tests
        run: npm test
        continue-on-error: true

      - name: Run performance tests (separate process)
        id: performance_tests
        run: npm run test:performance
        continue-on-error: true

      - name: Debug failed tests environment
        if: steps.original_tests.outcome == 'failure'
        shell: bash
        run: |
          echo "=== Original tests failed, debugging environment ==="
          echo "Current directory: $(pwd)"
          echo "Contents of current directory:"
          ls -la
          echo "=== Checking if package.json exists ==="
          if [ -f "package.json" ]; then
            echo "✓ package.json exists"
            echo "First 5 lines:"
            head -5 package.json
          else
            echo "✗ package.json NOT FOUND"
          fi

      - name: Enforce unit test result
        if: always()
        shell: bash
        env:
          TEST_OUTCOME: ${{ steps.original_tests.outcome }}
        run: |
          if [ "$TEST_OUTCOME" != "success" ]; then
            echo "Unit tests failed for the core build gate."
            exit 1
          fi

      - name: Enforce performance test result
        if: always()
        shell: bash
        env:
          TEST_OUTCOME: ${{ steps.performance_tests.outcome }}
        run: |
          if [ "$TEST_OUTCOME" != "success" ]; then
            echo "Performance tests failed for the core build gate."
            exit 1
          fi

      - name: Validation complete
        run: |
          echo "✅ Core Build & Test Complete!"
          echo "Platform: ${{ matrix.os }}"
          echo "Node.js: ${{ matrix.node-version }}"

  postgres-integration:
    name: PostgreSQL Integration
    permissions:
      contents: read
    runs-on: ubuntu-latest
    # The first complete 126-suite serial runs consumed 1,048-1,080 seconds
    # (87-90% of the former 20-minute cap). Keep capacity headroom as the
    # required integration tree grows; per-test startup timeouts are repaired
    # independently and are not masked by this job-level budget.
    timeout-minutes: 30
    env:
      DOLLHOUSE_REQUIRE_TEST_DATABASE: '1'
      DOLLHOUSE_REQUIRE_PG_AUTH_TESTS: '1'
      DOLLHOUSE_TEST_DATABASE_URL: postgres://dollhouse_app@localhost:5432/dollhousemcp_test
      DOLLHOUSE_TEST_DATABASE_ADMIN_URL: postgres://dollhouse@localhost:5432/dollhousemcp_test
      TEST_PERSONAS_DIR: ${{ github.workspace }}/test-personas

    services:
      postgres:
        image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_USER: dollhouse
          # The service is isolated to an ephemeral hosted runner. Trust auth
          # avoids committing even a test-only database credential to YAML.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dollhouse -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js 20
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build project
        run: npm run build

      - name: Run required PostgreSQL integration suite
        run: npm run test:integration -- --runInBand
