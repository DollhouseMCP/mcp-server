---
name: Docker Testing
# Uses native ARM64 runners (ubuntu-24.04-arm) for ARM64 builds to eliminate QEMU emulation overhead
# AMD64 builds use ubuntu-latest, ARM64 builds use native ARM64 hardware
# This eliminates the 10-22x performance penalty of QEMU emulation for TypeScript compilation

on:
  push:
    branches: [main, develop, beta]
  pull_request:
    branches: [main, develop, beta]
  workflow_dispatch:

permissions: {}

env:
  NODE_OPTIONS: --max-old-space-size=4096
  CI: true
  TEST_PERSONAS_DIR: ${{ github.workspace }}/test-personas
  # Enhanced debugging environment variables
  BUILDX_NO_DEFAULT_ATTESTATIONS: 1
  DOCKER_BUILDKIT: 1
  BUILDKIT_PROGRESS: plain

jobs:
  docker-build-test:
    name: Docker Build & Test (${{ matrix.platform }})
    permissions:
      contents: read
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: 🚀 Session Start - Log System Information
        shell: bash
        run: |
          echo "======================================"
          echo "🔍 CI ENVIRONMENT DIAGNOSTIC SESSION"
          echo "======================================"
          echo "⏰ Session Start: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "📍 Platform Target: ${{ matrix.platform }}"
          echo "🖥️ Runner OS: ${{ runner.os }}"
          echo "🏗️ Runner Architecture: ${{ runner.arch }}"
          echo "🎯 Runner Type: ${{ matrix.runner }}"
          echo "📦 Workflow: ${{ github.workflow }}"
          echo "🔄 Run ID: ${{ github.run_id }}"
          if [ "${{ matrix.platform }}" = "linux/arm64" ]; then
            echo "🚀 ARM64: Using NATIVE runner (no QEMU emulation)"
          else
            echo "🚀 AMD64: Using standard runner"
          fi
          echo "======================================"

          echo "\n🖥️ SYSTEM RESOURCES:"
          echo "CPU Info:"
          nproc || echo "nproc not available"
          cat /proc/cpuinfo | grep -E 'processor|model name|cpu cores' | head -10 || echo "CPU info not available"
          echo "\nMemory Info:"
          free -h || echo "free command not available"
          echo "\nDisk Space:"
          df -h / || echo "df command not available"
          echo "\nLoad Average:"
          uptime || echo "uptime not available"

          echo "\n🐳 DOCKER ENVIRONMENT:"
          echo "Docker Version:"
          docker --version || echo "Docker not found"
          echo "Docker Info:"
          docker info | head -20 || echo "Docker info failed"
          echo "Docker System Status:"
          docker system df || echo "Docker system df failed"

          echo "\n🌐 NETWORK & CONNECTIVITY:"
          echo "Checking network connectivity..."
          ping -c 2 8.8.8.8 || echo "Network connectivity test failed"

          echo "======================================"
          echo "⏰ System Info Complete: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "======================================"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify optional runtime tool hardening offline
        shell: bash
        run: node --test tests/scripts/remove-optional-runtime-tools.test.mjs

      - name: Verify safety production packaging offline
        run: node --test tests/scripts/prepare-safety-runtime.test.mjs

      - name: Select the matching Node/npm toolchain for bundle controls
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '24.22.1'

      - name: Verify global npm artifact safety and refusal controls
        shell: bash
        run: |
          test "$(node --version)" = "v24.22.1"
          test "$(npm --version)" = "11.19.1"
          node --test tests/scripts/prepare-global-npm.test.mjs tests/scripts/stage-global-npm-vendor-patches.test.mjs

      - name: 🔧 Set up QEMU (AMD64 only - ARM64 uses native runner)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64
        if: matrix.platform == 'linux/amd64'

      - name: 🔧 Set up Docker Buildx (with diagnostics)
        shell: bash
        run: |
          echo "======================================"
          echo "⏰ Buildx Setup Start: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "📍 Target Platform: ${{ matrix.platform }}"
          echo "======================================"

          echo "\n🔍 Pre-Buildx Docker State:"
          docker version || echo "Docker version failed"
          docker buildx version || echo "Buildx not available"
          docker buildx ls || echo "No buildx instances"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: ${{ matrix.platform }}

      - name: 🔍 Buildx Post-Setup Diagnostics
        shell: bash
        run: |
          echo "\n🔍 Post-Buildx Docker State:"
          echo "Buildx instances:"
          docker buildx ls
          echo "\nCurrent builder info:"
          docker buildx inspect
          echo "\nSupported platforms:"
          docker buildx inspect | grep -A 10 "Platforms:" || echo "Platform info not available"

          echo "\n🧪 Platform Test:"
          echo "Testing basic platform compatibility..."
          docker buildx build --platform ${{ matrix.platform }} - <<< 'FROM alpine:latest' || echo "Platform test failed"

          echo "======================================"
          echo "⏰ Buildx Setup Complete: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "======================================"

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: docker-buildx-${{ runner.os }}-${{ matrix.platform }}-${{ github.sha }}
          restore-keys: |
            docker-buildx-${{ runner.os }}-${{ matrix.platform }}-
            docker-buildx-${{ runner.os }}-

      - name: 🔨 Build Docker image (builder stage) - VERBOSE
        shell: bash
        run: |
          echo "======================================"
          echo "⏰ Builder Stage Start: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "📍 Platform: ${{ matrix.platform }}"
          echo "======================================"

          # Convert platform to tag-safe format (replace / with -)
          PLATFORM_TAG=$(echo "${{ matrix.platform }}" | sed 's/\//-/g')
          echo "🏷️ Platform Tag: ${PLATFORM_TAG}"

          echo "\n🔍 Pre-Build Environment:"
          echo "Working Directory: $(pwd)"
          echo "Available Memory: $(free -h | grep Mem || echo 'Memory info unavailable')"
          echo "Docker Status: $(docker system df || echo 'Docker df failed')"
          echo "Build Context Size:"
          du -sh . || echo "Size calculation failed"

          echo "\n🏗️ Starting Docker Build with VERBOSE output..."
          echo "Command: docker buildx build --platform ${{ matrix.platform }} --target builder --progress=plain"

          # Store start time
          BUILD_START=$(date +%s)
          echo "⏰ Build Start Time: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"

          # Run build with verbose output and error handling
          set +e  # Don't exit on error, we want to capture it

          docker buildx build \
            --platform ${{ matrix.platform }} \
            --target builder \
            --tag dollhousemcp:builder-${PLATFORM_TAG} \
            --cache-from type=local,src=/tmp/.buildx-cache \
            --cache-to type=local,dest=/tmp/.buildx-cache-new,mode=max \
            --progress=plain \
            --load \
            --file docker/Dockerfile \
            . 2>&1 | tee /tmp/build-output.log

          BUILD_EXIT_CODE=$?
          BUILD_END=$(date +%s)
          BUILD_DURATION=$((BUILD_END - BUILD_START))

          echo "\n======================================"
          echo "⏰ Build End Time: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "⏱️ Build Duration: ${BUILD_DURATION} seconds"
          echo "🔄 Exit Code: ${BUILD_EXIT_CODE}"
          echo "======================================"

          echo "\n🔍 Post-Build Analysis:"
          echo "Final 50 lines of build output:"
          tail -50 /tmp/build-output.log || echo "Could not read build log"

          echo "\nDocker Images After Build:"
          docker images | grep dollhousemcp || echo "No dollhousemcp images found"

          echo "\nSystem Resources After Build:"
          free -h | grep Mem || echo "Memory info unavailable"
          docker system df || echo "Docker df failed"

          # Exit with the actual build exit code
          if [ $BUILD_EXIT_CODE -ne 0 ]; then
            echo "❌ BUILDER STAGE FAILED!"
            echo "Full build log contents:"
            cat /tmp/build-output.log || echo "Could not read full build log"
            exit $BUILD_EXIT_CODE
          else
            echo "✅ Builder stage completed successfully"
          fi

          set -e  # Re-enable exit on error

      - name: 🏗️ Build Docker image (production stage) - VERBOSE
        shell: bash
        run: |
          echo "======================================"
          echo "⏰ Production Stage Start: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "📍 Platform: ${{ matrix.platform }}"
          echo "======================================"

          # Convert platform to tag-safe format (replace / with -)
          PLATFORM_TAG=$(echo "${{ matrix.platform }}" | sed 's/\//-/g')
          echo "🏷️ Platform Tag: ${PLATFORM_TAG}"

          echo "\n🔍 Pre-Production Build State:"
          echo "Available Images:"
          docker images | grep dollhousemcp || echo "No dollhousemcp images found"
          echo "Available Memory: $(free -h | grep Mem || echo 'Memory info unavailable')"
          echo "Docker Status: $(docker system df || echo 'Docker df failed')"

          # Store start time
          PROD_START=$(date +%s)
          echo "⏰ Production Build Start: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"

          # Run production build with verbose output
          set +e  # Don't exit on error, we want to capture it

          docker buildx build \
            --platform ${{ matrix.platform }} \
            --target production \
            --tag dollhousemcp:latest-${PLATFORM_TAG} \
            --label org.dollhousemcp.engine-proof-source=${{ github.sha }} \
            --cache-from type=local,src=/tmp/.buildx-cache \
            --cache-to type=local,dest=/tmp/.buildx-cache-new,mode=max \
            --progress=plain \
            --load \
            --file docker/Dockerfile \
            . 2>&1 | tee /tmp/prod-build-output.log

          PROD_EXIT_CODE=$?
          PROD_END=$(date +%s)
          PROD_DURATION=$((PROD_END - PROD_START))

          echo "\n======================================"
          echo "⏰ Production Build End: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "⏱️ Production Duration: ${PROD_DURATION} seconds"
          echo "🔄 Exit Code: ${PROD_EXIT_CODE}"
          echo "======================================"

          echo "\n🔍 Post-Production Analysis:"
          echo "Final production images:"
          docker images | grep dollhousemcp || echo "No dollhousemcp images found"

          echo "\nImage layers and size:"
          docker history dollhousemcp:latest-${PLATFORM_TAG} || echo "Could not inspect image history"

          # Exit with the actual build exit code
          if [ $PROD_EXIT_CODE -ne 0 ]; then
            echo "❌ PRODUCTION STAGE FAILED!"
            echo "Full production build log:"
            cat /tmp/prod-build-output.log || echo "Could not read production build log"
            exit $PROD_EXIT_CODE
          else
            echo "✅ Production stage completed successfully"
          fi

          set -e  # Re-enable exit on error
          # Capture the immutable production identity before any runtime tests.
          docker image inspect --format '{{.Id}}' "dollhousemcp:latest-${PLATFORM_TAG}" > "$RUNNER_TEMP/beta3-tested-production.id"

      - name: Verify private drain hold against native Docker restart manager
        if: matrix.platform == 'linux/amd64'
        shell: bash
        run: |
          set -euo pipefail
          image_id=$(docker image inspect --format '{{.Id}}' dollhousemcp:latest-linux-amd64)
          python3 tests/scripts/memory-upgrade-docker-engine.py "$image_id" "$GITHUB_SHA" | tee /tmp/memory-upgrade-engine-proof.json

      - name: Preserve owned Docker drain proof
        if: always() && matrix.platform == 'linux/amd64'
        uses: actions/upload-artifact@v4
        with:
          name: memory-upgrade-engine-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/memory-upgrade-engine-proof.json
          if-no-files-found: ignore

      - name: Scan Docker image for vulnerabilities
        uses: anchore/scan-action@v3
        with:
          image: dollhousemcp:latest-linux-amd64
          fail-build: false  # Don't fail build on vulnerabilities, just report
          severity-cutoff: high
        continue-on-error: true
        if: matrix.platform == 'linux/amd64'  # Only scan AMD64 to save time on ARM64 builds

      - name: 🚀 Test MCP server initialization - ULTRA VERBOSE
        shell: bash
        run: |
          echo "========================================="
          echo "⏰ MCP Test Start: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "📍 Platform: ${{ matrix.platform }}"
          echo "🎯 Test: MCP Server Initialization"
          echo "========================================="

          # Convert platform to tag-safe format (replace / with -)
          PLATFORM_TAG=$(echo "${{ matrix.platform }}" | sed 's/\//-/g')
          echo "🏷️ Platform Tag: ${PLATFORM_TAG}"

          echo "\n🔍 Pre-Test Environment Check:"
          echo "Available Images:"
          docker images | grep dollhousemcp || echo "No dollhousemcp images found - THIS IS A PROBLEM!"
          echo "\nSystem Resources:"
          free -h | grep Mem || echo "Memory info unavailable"
          echo "Available CPU: $(nproc || echo 'nproc unavailable')"
          echo "Load Average: $(uptime || echo 'uptime unavailable')"

          echo "\n🧪 Container Preparation Test:"
          echo "Testing basic container creation for platform ${{ matrix.platform }}..."
          docker run --rm --platform ${{ matrix.platform }} dollhousemcp:latest-${PLATFORM_TAG} echo "Container creation test passed" || {
            echo "❌ CRITICAL: Cannot create basic container for platform ${{ matrix.platform }}!"
            echo "This indicates a fundamental platform compatibility issue."
            exit 1
          }

          echo "\n📝 Constructing MCP Test Command:"
          MCP_JSON_REQUEST='{"jsonrpc":"2.0","method":"initialize","params":{"protocolVersion":"1.0.0","capabilities":{},"clientInfo":{"name":"test","version":"1.0.0"}},"id":1}'
          echo "JSON Request: $MCP_JSON_REQUEST"

          DOCKER_CMD="docker run -i \
            --platform ${{ matrix.platform }} \
            --user 1001:1001 \
            --security-opt no-new-privileges \
            --read-only \
            --tmpfs /tmp:noexec,nosuid,mode=1777 \
            --tmpfs /app/tmp:noexec,nosuid,mode=1777 \
            --memory 512m \
            --cpus 0.5 \
            --env DOLLHOUSE_PORTFOLIO_DIR=/app/tmp/portfolio \
            --env DOLLHOUSE_CACHE_DIR=/app/tmp/cache \
            --env NODE_ENV=test \
            dollhousemcp:latest-${PLATFORM_TAG}"

          echo "\nDocker Command: $DOCKER_CMD"

          echo "\n⏰ Starting MCP Test with Platform-Specific Timeout:"
          if [ "${{ matrix.platform }}" = "linux/arm64" ]; then
            TIMEOUT_DURATION=10
            echo "🚀 ARM64 Platform: Using native ARM64 runner, timeout of ${TIMEOUT_DURATION}s"
          else
            TIMEOUT_DURATION=5
            echo "🚀 AMD64 Platform: Using standard timeout of ${TIMEOUT_DURATION}s"
          fi

          # Store test start time
          TEST_START=$(date +%s)
          echo "⏰ Test Start Time: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"

          # Run the test with comprehensive error capture
          set +e  # Don't exit on error, we want to analyze it

          echo "\n🔄 Executing MCP Server Test..."
          docker_output=$(timeout $TIMEOUT_DURATION sh -c "echo '$MCP_JSON_REQUEST' | $DOCKER_CMD 2>&1" || true)
          test_exit_code=$?

          TEST_END=$(date +%s)
          TEST_DURATION=$((TEST_END - TEST_START))

          echo "\n========================================="
          echo "⏰ Test End Time: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "⏱️ Test Duration: ${TEST_DURATION} seconds (timeout was ${TIMEOUT_DURATION}s)"
          echo "🔄 Exit Code: ${test_exit_code}"
          echo "========================================="

          echo "\n📊 DETAILED OUTPUT ANALYSIS:"
          echo "Raw output length: ${#docker_output} characters"

          if [ -z "$docker_output" ]; then
            echo "❌ CRITICAL: No output captured at all!"
            echo "This suggests the container failed to start or produce any output."
          else
            echo "✅ Output captured, analyzing content..."
            echo "\n📋 FULL RAW OUTPUT (first 5000 chars):"
            echo "--- BEGIN OUTPUT ---"
            echo "$docker_output" | head -c 5000
            echo ""
            echo "--- END OUTPUT ---"

            # Extract and display JSON-RPC response if present
            echo "\n🔍 SEARCHING FOR JSON-RPC RESPONSE:"
            json_response=$(echo "$docker_output" | grep -o '{"jsonrpc":"2.0"[^}]*}' || echo "")
            if [ -n "$json_response" ]; then
              echo "✅ FOUND JSON-RPC RESPONSE:"
              echo "$json_response" | jq '.' 2>/dev/null || echo "$json_response"

              # Extract specific fields for validation
              echo "\n📊 RESPONSE DETAILS:"
              echo "- Protocol: $(echo "$json_response" | grep -o '"jsonrpc":"[^"]*"' || echo 'Not found')"
              echo "- ID: $(echo "$json_response" | grep -o '"id":[^,}]*' || echo 'Not found')"
              echo "- Server Name: $(echo "$json_response" | grep -o '"name":"[^"]*"' || echo 'Not found')"
              echo "- Has Result: $(echo "$json_response" | grep -q '"result"' && echo 'Yes' || echo 'No')"
              echo "- Has Error: $(echo "$json_response" | grep -q '"error"' && echo 'Yes' || echo 'No')"
            else
              echo "⚠️ No JSON-RPC response pattern found in output"
              echo "Looking for any JSON-like content..."
              echo "$docker_output" | grep -o '{.*}' | head -5 || echo "No JSON patterns found"
            fi
          fi

          echo "\n🔍 PLATFORM-SPECIFIC ANALYSIS:"
          if [ "${{ matrix.platform }}" = "linux/arm64" ]; then
            echo "🚀 ARM64 Analysis:"
            echo "- Running on native ARM64 runner (ubuntu-24.04-arm)"
            echo "- No QEMU emulation overhead"
            echo "- Expected native performance"
            echo "- Timeout duration: ${TIMEOUT_DURATION}s"
            echo "- Actual duration: ${TEST_DURATION}s"

            if [ $TEST_DURATION -ge $TIMEOUT_DURATION ]; then
              echo "⚠️ Test hit timeout limit - investigate performance issue!"
            else
              echo "✅ Test completed within timeout window"
            fi
          else
            echo "🚀 AMD64 Analysis:"
            echo "- Running natively on x86_64"
            echo "- Expected fast performance"
            echo "- Duration: ${TEST_DURATION}s"
          fi

          echo "\n🧪 JSON-RPC RESPONSE VALIDATION:"
          if echo "$docker_output" | grep -q '"jsonrpc":"2.0".*"id":1'; then
            echo "✅ Valid JSON-RPC response structure found"

            if echo "$docker_output" | grep -q '"serverInfo":{"name":"dollhousemcp"'; then
              echo "✅ Correct serverInfo found - MCP server is working properly"
              echo "\n🎉 TEST PASSED FOR ${{ matrix.platform }}!"
            else
              echo "❌ FAILED: MCP initialize response is missing expected serverInfo"
              echo "Response may be incomplete or malformed"
              exit 1
            fi
          else
            echo "❌ FAILED: No valid JSON-RPC response found"
            echo "\n🔍 FAILURE ANALYSIS:"

            # Check for common failure patterns
            if echo "$docker_output" | grep -qi "error\|failed\|exception"; then
              echo "🔥 Error messages found in output:"
              echo "$docker_output" | grep -i "error\|failed\|exception" || echo "Could not extract error messages"
            fi

            if echo "$docker_output" | grep -qi "timeout\|killed"; then
              echo "⏰ Timeout-related messages:"
              echo "$docker_output" | grep -i "timeout\|killed" || echo "Could not extract timeout messages"
            fi

            if [ $test_exit_code -eq 124 ]; then
              echo "⏰ TIMEOUT CONFIRMED: Test was killed by timeout command"
              echo "This means the server took longer than ${TIMEOUT_DURATION}s to respond"
              if [ "${{ matrix.platform }}" = "linux/arm64" ]; then
                echo "💡 NOTE: Running on native ARM64 - timeout should not be due to emulation"
              fi
            elif [ $test_exit_code -ne 0 ]; then
              echo "💥 NON-ZERO EXIT: Docker command failed with code $test_exit_code"
            fi

            echo "\n❌ MCP SERVER TEST FAILED FOR ${{ matrix.platform }}"
            set -e
            exit 1
          fi

          set -e  # Re-enable exit on error
          echo "\n========================================="
          echo "✅ MCP INITIALIZATION TEST COMPLETED SUCCESSFULLY"
          echo "Platform: ${{ matrix.platform }}"
          echo "Duration: ${TEST_DURATION}s"
          echo "========================================="

      - name: 🔍 Test MCP server with tools/list command - VERBOSE
        shell: bash
        run: |
          echo "========================================="
          echo "⏰ Tools/List Test Start: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "📍 Platform: ${{ matrix.platform }}"
          echo "🎯 Test: MCP Server Tools/List Functionality"
          echo "========================================="

          # Convert platform to tag-safe format (replace / with -)
          PLATFORM_TAG=$(echo "${{ matrix.platform }}" | sed 's/\//-/g')
          echo "🏷️ Platform Tag: ${PLATFORM_TAG}"

          echo "\n📝 Constructing Tools/List Test Command:"
          INIT_JSON_REQUEST='{"jsonrpc":"2.0","method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"docker-ci","version":"1.0.0"}},"id":1}'
          INITIALIZED_NOTIFICATION='{"jsonrpc":"2.0","method":"notifications/initialized"}'
          TOOLS_JSON_REQUEST='{"jsonrpc":"2.0","method":"tools/list","params":{},"id":2}'
          echo "Initialization Request: $INIT_JSON_REQUEST"
          echo "Initialized Notification: $INITIALIZED_NOTIFICATION"
          echo "Tools/List Request: $TOOLS_JSON_REQUEST"

          echo "\n⏰ Starting Tools/List Test with Platform-Specific Timeout:"
          if [ "${{ matrix.platform }}" = "linux/arm64" ]; then
            TIMEOUT_DURATION=10
            echo "🚀 ARM64 Platform: Using native ARM64 runner, timeout of ${TIMEOUT_DURATION}s"
          else
            TIMEOUT_DURATION=5
            echo "🚀 AMD64 Platform: Using standard timeout of ${TIMEOUT_DURATION}s"
          fi

          # Store test start time
          TOOLS_START=$(date +%s)
          echo "⏰ Tools Test Start Time: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"

          # Run the tools/list test
          set +e  # Don't exit on error, we want to analyze it

          echo "\n🔄 Executing Tools/List Test..."
          docker_output=$(timeout $TIMEOUT_DURATION sh -c "printf '%s\\n' '$INIT_JSON_REQUEST' '$INITIALIZED_NOTIFICATION' '$TOOLS_JSON_REQUEST' | \
            docker run -i \
            --platform ${{ matrix.platform }} \
            --user 1001:1001 \
            --security-opt no-new-privileges \
            --read-only \
            --tmpfs /tmp:noexec,nosuid,mode=1777 \
            --tmpfs /app/tmp:noexec,nosuid,mode=1777 \
            --memory 512m \
            --cpus 0.5 \
            --env DOLLHOUSE_PORTFOLIO_DIR=/app/tmp/portfolio \
            --env DOLLHOUSE_CACHE_DIR=/app/tmp/cache \
            --env NODE_ENV=test \
            dollhousemcp:latest-${PLATFORM_TAG} 2>&1" || true)

          tools_exit_code=$?
          TOOLS_END=$(date +%s)
          TOOLS_DURATION=$((TOOLS_END - TOOLS_START))

          echo "\n========================================="
          echo "⏰ Tools Test End Time: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "⏱️ Tools Test Duration: ${TOOLS_DURATION} seconds"
          echo "🔄 Exit Code: ${tools_exit_code}"
          echo "========================================="

          echo "\n📋 TOOLS/LIST RAW OUTPUT (first 5000 chars):"
          echo "--- BEGIN OUTPUT ---"
          echo "$docker_output" | head -c 5000
          echo ""
          echo "--- END OUTPUT ---"

          # Extract and display tools/list response
          echo "\n🔍 EXTRACTING TOOLS/LIST JSON-RPC RESPONSE:"
          tools_response=$(echo "$docker_output" | grep '"jsonrpc":"2.0".*"id":2' | tail -1 || true)
          if [ -n "$tools_response" ]; then
            echo "✅ FOUND TOOLS/LIST JSON-RPC RESPONSE:"
            # Try to pretty print with jq, fall back to raw if jq fails
            echo "$tools_response" | jq '.' 2>/dev/null || echo "$tools_response"

            # Extract details about the tools
            echo "\n📊 TOOLS/LIST RESPONSE ANALYSIS:"
            echo "- Protocol Version: $(echo "$tools_response" | grep -o '"jsonrpc":"[^"]*"' || echo 'Not found')"
            echo "- Request ID: $(echo "$tools_response" | grep -o '"id":[^,}]*' || echo 'Not found')"

            # Check if we have tools in the response
            if echo "$tools_response" | jq -e '.result.tools | type == "array" and length > 0' >/dev/null 2>&1; then
              echo "- Tools Array: ✅ Present"
              tool_names=$(echo "$tools_response" | jq -r '.result.tools[].name // empty')
              tool_count=$(echo "$tool_names" | wc -l | tr -d ' ')
              echo "- Tool Count: $tool_count tools returned"
              if [ -n "$tool_names" ]; then
                echo "\n📦 TOOLS FOUND:"
                echo "$tool_names" | head -10 | while read -r tool; do
                  echo "  - $tool"
                done
                if [ "$tool_count" -gt 10 ]; then
                  echo "  ... and $((tool_count - 10)) more"
                fi
              fi
            else
              echo "- Tools Array: ❌ Not found or empty"
            fi
          else
            echo "⚠️ No valid JSON-RPC response found in tools/list output"
            echo "Checking for any JSON-like patterns..."
            echo "$docker_output" | grep -o '{.*}' | head -3 || echo "No JSON patterns detected"
          fi

          echo "\n🧪 JSON-RPC RESPONSE VALIDATION:"
          if [ -n "$tools_response" ]; then
            echo "✅ Valid JSON-RPC response structure found for tools/list"

            if echo "$tools_response" | jq -e '.result.tools | type == "array" and length > 0' >/dev/null 2>&1; then
              echo "✅ Response contains a non-empty result.tools array"
              echo "\n🎉 TOOLS/LIST TEST PASSED FOR ${{ matrix.platform }}!"
            else
              echo "❌ FAILED: tools/list response does not contain a non-empty result.tools array"
              echo "Response may be incomplete or may contain a JSON-RPC error"
              exit 1
            fi
          else
            echo "❌ FAILED: No valid JSON-RPC response found for tools/list"
            echo "\n🔍 TOOLS/LIST FAILURE ANALYSIS:"

            if [ $tools_exit_code -eq 124 ]; then
              echo "⏰ TIMEOUT: Tools/list test was killed by timeout"
              echo "Duration: ${TOOLS_DURATION}s (limit: ${TIMEOUT_DURATION}s)"
            else
              echo "💥 Command failed with exit code: $tools_exit_code"
            fi

            echo "\n❌ TOOLS/LIST TEST FAILED FOR ${{ matrix.platform }}"
            set -e
            exit 1
          fi

          set -e  # Re-enable exit on error
          echo "\n========================================="
          echo "✅ TOOLS/LIST TEST COMPLETED SUCCESSFULLY"
          echo "Platform: ${{ matrix.platform }}"
          echo "Duration: ${TOOLS_DURATION}s"
          echo "========================================="


      - name: Preserve the exact tested production image for static qualification
        shell: bash
        env:
          EVIDENCE_PLATFORM: ${{ matrix.platform }}
          EVIDENCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY_EVIDENCE'
          import hashlib
          import json
          import os
          import pathlib
          import platform
          import re
          import subprocess


          def output(*args):
              return subprocess.check_output(args, text=True).strip()


          def require(condition, message):
              if not condition:
                  raise SystemExit(message)


          expected = os.environ['EVIDENCE_PLATFORM']
          require(expected in {'linux/amd64', 'linux/arm64'}, 'Unexpected evidence platform')
          image_id = pathlib.Path(os.environ['RUNNER_TEMP'], 'beta3-tested-production.id').read_text().strip()
          require(re.fullmatch(r'sha256:[a-f0-9]{64}', image_id), 'Invalid tested production identity')
          tag = 'dollhousemcp:latest-' + expected.replace('/', '-')
          require(output('docker', 'image', 'inspect', '--format', '{{.Id}}', tag) == image_id,
                  'Production tag changed after runtime tests')
          image = json.loads(output('docker', 'image', 'inspect', image_id))[0]
          require(image['Id'] == image_id and image['Os'] + '/' + image['Architecture'] == expected,
                  'Production image identity/platform mismatch')
          host_arches = {'linux/amd64': {'x86_64', 'amd64'}, 'linux/arm64': {'aarch64', 'arm64'}}
          require(platform.machine().lower() in host_arches[expected], 'Runtime was not native for this platform')
          checkout = output('git', 'rev-parse', 'HEAD')
          checkout_tree = output('git', 'rev-parse', 'HEAD^{tree}')
          head = os.environ['EVIDENCE_HEAD_SHA']
          require(all(re.fullmatch(r'[a-f0-9]{40}', value) for value in (checkout, checkout_tree, head)),
                  'Invalid source identity')
          commit_headers = output('git', 'cat-file', 'commit', 'HEAD').split('\n\n', 1)[0]
          parents = [line.split(' ', 1)[1] for line in commit_headers.splitlines() if line.startswith('parent ')]
          require(all(re.fullmatch(r'[a-f0-9]{40}', parent) for parent in parents), 'Invalid checkout parent')
          require(head == checkout or (os.environ['GITHUB_EVENT_NAME'] == 'pull_request' and head in parents),
                  'Recorded source head is not the tested checkout or its direct PR parent')
          require(checkout == os.environ['GITHUB_SHA'], 'Checkout differs from the tested workflow source')
          require(output('git', 'status', '--porcelain', '--untracked-files=no') == '', 'Tracked source changed during tests')
          config = image['Config']
          require(config['User'] == 'dollhouse' and config['Cmd'] == ['node', '--trace-warnings', 'dist/index.js'],
                  'Refuse builder or unexpected runtime command')
          require(config.get('Labels', {}).get('org.dollhousemcp.engine-proof-source') == checkout,
                  'Image source label differs from tested checkout')
          # Only the public constants in the approved Node base and production Dockerfile
          # may enter the image config. No workflow credential or runtime environment is passed.
          environment = dict(item.split('=', 1) for item in config['Env'])
          expected_environment = {
              'NODE_VERSION': '24.22.1', 'YARN_VERSION': '1.22.22', 'NODE_ENV': 'production',
              'PERSONAS_DIR': '/app/data/personas', 'NODE_OPTIONS': '--max-old-space-size=256',
              'DOLLHOUSE_DISABLE_UPDATES': 'true', 'DOLLHOUSE_SECURITY_MODE': 'strict',
              'DOLLHOUSE_PORTFOLIO_DIR': '/app/tmp/portfolio', 'DOLLHOUSE_CACHE_DIR': '/app/tmp/cache',
              'PATH': '/app/node_modules/.bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin',
          }
          require(len(config['Env']) == len(expected_environment) and environment == expected_environment,
                  'Unexpected production image environment; do not upload')
          folder = pathlib.Path(os.environ['RUNNER_TEMP'], 'beta3-runtime-evidence')
          folder.mkdir(mode=0o700)
          archive = folder / ('production-' + expected.replace('/', '-') + '.docker.tar')
          # Save the immutable image, never a container's writable layer or builder image.
          subprocess.run(['docker', 'image', 'save', '--output', str(archive), image_id], check=True)
          digest = hashlib.sha256()
          with archive.open('rb') as stream:
              for block in iter(lambda: stream.read(1024 * 1024), b''):
                  digest.update(block)
          sha = digest.hexdigest()
          (folder / 'SHA256SUMS').write_text(sha + '  ' + archive.name + '\n')
          metadata = {
              'formatVersion': 1, 'imageId': image_id, 'platform': expected, 'nativeRunnerArch': platform.machine(),
              'sourceHeadSha': head, 'testedCheckoutSha': checkout, 'testedCheckoutTree': checkout_tree,
              'testedCheckoutParents': parents,
              'runId': os.environ['GITHUB_RUN_ID'], 'runAttempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'rootFsDiffIds': image['RootFS']['Layers'], 'archive': archive.name,
              'archiveSha256': sha, 'archiveBytes': archive.stat().st_size,
              'collectedAfterRequiredRuntimeTests': True,
              'nativeDockerRestartWitness': 'passed' if expected == 'linux/amd64' else 'not-selected',
              'imageEnvironmentCheckedAgainstPublicConstants': True,
              'runtimeWritableLayerIncluded': False, 'builderImageIncluded': False,
          }
          (folder / 'metadata.json').write_text(json.dumps(metadata, indent=2) + '\n')
          print(json.dumps(metadata))
          PY_EVIDENCE

      - name: Upload tested production image evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2; existing repository pin
        with:
          name: tested-production-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/beta3-runtime-evidence/
          if-no-files-found: error
          retention-days: 1
          compression-level: 1

      - name: Cleanup containers
        if: always()
        shell: bash
        run: |
          echo "🧹 Cleaning up any dangling containers..."
          docker system prune -f --volumes || true

      - name: Move cache
        if: always()
        shell: bash
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache || true

      - name: Docker testing complete
        shell: bash
        run: |
          echo "✅ Docker Testing Complete for ${{ matrix.platform }}!"
          echo "Platform: ${{ matrix.platform }}"
          echo "All tests passed successfully"

  docker-compose-test:
    name: Docker Compose Test
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPOSE_PROJECT_NAME: dollhouse-${{ github.run_id }}-${{ github.run_attempt }}-github

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Test MINIMAL Docker Compose (hello world test)
        shell: bash
        run: |
          echo "🧪 Testing MINIMAL Docker Compose to verify Docker works at all..."
          echo "This should just echo 'Hello' and exit successfully"
          docker compose --project-name "$COMPOSE_PROJECT_NAME" --file docker/docker-compose.minimal.yml build minimal-test
          docker compose --project-name "$COMPOSE_PROJECT_NAME" --file docker/docker-compose.minimal.yml run --rm minimal-test
          echo "✅ Minimal Docker test passed!"

      - name: Test Docker Compose build
        shell: bash
        run: |
          echo "🐳 Testing Docker Compose build..."
          echo "📁 Verifying directory structure before Docker build:"
          echo "Current directory: $(pwd)"
          echo "Checking if src/ exists:"
          ls -la src/ | head -5 || echo "src/ directory not found!"
          echo "Checking docker/ directory:"
          ls -la docker/ || echo "docker/ directory not found!"
          echo "Using docker-compose.yml with proper tmpfs permissions"
          # Build using the regular Dockerfile which compiles TypeScript inside Docker
          docker compose --project-name "$COMPOSE_PROJECT_NAME" --file docker/docker-compose.yml build dollhousemcp

      - name: Test Docker Compose startup
        shell: bash
        run: |
          echo "🚀 Testing Docker Compose startup..."

          # Run MCP server with initialize command via Docker Compose
          echo "⏳ Running MCP server via Docker Compose with initialize command..."
          # Portfolio directory is already set to /app/tmp/portfolio in docker-compose.yml
          # Use timeout since MCP server runs indefinitely
          docker_output=$(timeout 10 sh -c 'printf "%s\n" '"'"'{"jsonrpc":"2.0","method":"initialize","params":{"protocolVersion":"1.0.0","capabilities":{},"clientInfo":{"name":"test","version":"1.0.0"}},"id":1}'"'"' | docker compose --project-name "$COMPOSE_PROJECT_NAME" --file docker/docker-compose.yml run --rm --interactive -T dollhousemcp 2>&1' || true)
          exit_code=$?

          echo "Docker Compose run completed with exit code: $exit_code"
          echo "Output captured:"
          echo "$docker_output"

          # Check for successful MCP response from Docker Compose
          if echo "$docker_output" | grep -q '"jsonrpc":"2.0".*"id":1'; then
            echo "✅ Docker Compose MCP server returned valid JSON-RPC response"
            if echo "$docker_output" | grep -q '"serverInfo":{"name":"dollhousemcp"'; then
              echo "✅ Response contains correct serverInfo - server is working"
            else
              echo "❌ FAILED: Docker Compose initialize response is missing expected serverInfo"
              exit 1
            fi
          else
            echo "❌ FAILED: Docker Compose MCP server did not return a JSON-RPC response"
            echo "The server is not responding to API calls through Docker Compose"
            exit 1
          fi

      - name: Cleanup Docker Compose
        if: always()
        shell: bash
        run: |
          echo "🧹 Cleaning up Docker Compose..."
          cleanup_ok=false
          for attempt in 1 2 3; do
            if docker compose --project-name "$COMPOSE_PROJECT_NAME" --file docker/docker-compose.yml down --remove-orphans; then
              cleanup_ok=true
              break
            fi
            echo "::warning::Docker Compose cleanup attempt $attempt failed; waiting for endpoints to detach"
            docker compose --project-name "$COMPOSE_PROJECT_NAME" --file docker/docker-compose.yml ps || true
            sleep 2
          done

          if [ "$cleanup_ok" != "true" ]; then
            echo "::warning::Docker Compose network cleanup remained busy after retries; continuing because test execution already completed"
          fi

          docker compose --project-name "$COMPOSE_PROJECT_NAME" --file docker/docker-compose.yml rm -f || true

      - name: Docker Compose testing complete
        shell: bash
        run: |
          echo "✅ Docker Compose Testing Complete!"
          echo "All tests passed successfully"
