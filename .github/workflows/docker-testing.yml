name: Docker Testing

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  native-http-health:
    name: Native retained image HTTP health (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            artifact: '13693175262'
            zip_sha: 19c2d805f1d2ed43bad0c0a0fba26a713a15290aa99ab492fafcd7e606e8bc24
            tar_sha: 0b84a3986331a4a05fe13c29822e2644954f122649952a70561b8b224d75840e
            store_id: sha256:ef8e416e2670e4898b4b2d1dcfda71195002f5f4f79959748960b50c596e169c
            config_id: sha256:449a0c60d810ee923ec4b8e84413d2080915936e17a8ef7ea5d7337f18226656
            manifest_id: sha256:ef8e416e2670e4898b4b2d1dcfda71195002f5f4f79959748960b50c596e169c
          - arch: arm64
            runner: ubuntu-24.04-arm
            artifact: '13692225753'
            zip_sha: d06fe974a54b471e591f6710ad66473ba3467ddd8d8bb611b2cbbd7add4ff257
            tar_sha: 225dc0cab30c583483e1c4baa0ef95e29c6bf99885ba8c99bfcb4857a21d70cd
            store_id: sha256:9bd866518fb108ff41134567ff86a3e092af2f5017d226ea41b121fab52cbb04
            config_id: sha256:9bd866518fb108ff41134567ff86a3e092af2f5017d226ea41b121fab52cbb04
            manifest_id: sha256:af5df78fa1b30023a9fea4bd73c069df901bcedfea69c3126f58c176d32c08e8
    env:
      SOURCE_SHA: 3821bdf21be09367203703f5418e221ff3cd178e
      SOURCE_TREE: e42c18a235f668382a7c70356576dee7396744fe
      ARCH: ${{ matrix.arch }}
      ARTIFACT: ${{ matrix.artifact }}
      ZIP_SHA: ${{ matrix.zip_sha }}
      TAR_SHA: ${{ matrix.tar_sha }}
      STORE_ID: ${{ matrix.store_id }}
      CONFIG_ID: ${{ matrix.config_id }}
      MANIFEST_ID: ${{ matrix.manifest_id }}
    steps:
      - name: Check out the exact tested source
        uses: actions/checkout@v4
        with:
          ref: 3821bdf21be09367203703f5418e221ff3cd178e
          persist-credentials: false
      - name: Verify and load the retained tested image
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$SOURCE_TREE"
          case "$ARCH:$(uname -m)" in amd64:x86_64|arm64:aarch64) ;; *) exit 1 ;; esac
          mkdir -m 700 "$RUNNER_TEMP/health-evidence"
          timeout 120s gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT}/zip" > "$RUNNER_TEMP/image.zip"
          test "$(sha256sum "$RUNNER_TEMP/image.zip" | cut -d' ' -f1)" = "$ZIP_SHA"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, sys, zipfile
          sys.path.insert(0, 'scripts')
          from image_archive_identity import verify_saved_image_file
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          arch = os.environ['ARCH']
          archive_name = f'production-linux-{arch}.docker.tar'
          with zipfile.ZipFile(root / 'image.zip') as zipped:
              names = zipped.namelist()
              if sorted(names) != sorted(['SHA256SUMS', 'metadata.json', archive_name]):
                  raise ValueError('unexpected artifact members')
              info = zipped.getinfo(archive_name)
              if not 0 < info.file_size <= 1024**3:
                  raise ValueError('archive size outside bound')
              if zipped.getinfo('metadata.json').file_size > 65536:
                  raise ValueError('metadata too large')
              metadata_bytes = zipped.read('metadata.json')
              if len(metadata_bytes) > 65536:
                  raise ValueError('metadata too large')
              metadata = json.loads(metadata_bytes)
              with zipped.open(info) as source, (root / 'image.tar').open('xb') as target:
                  digest = hashlib.sha256()
                  while block := source.read(1024 * 1024):
                      digest.update(block)
                      target.write(block)
          if digest.hexdigest() != os.environ['TAR_SHA'] or metadata['archiveSha256'] != os.environ['TAR_SHA']:
              raise ValueError('archive digest mismatch')
          if (metadata['testedCheckoutSha'], metadata['sourceHeadSha'], metadata['testedCheckoutTree'],
              metadata['platform'], metadata['imageId'], metadata['runId'], metadata['runAttempt']) != (
              os.environ['SOURCE_SHA'], os.environ['SOURCE_SHA'], os.environ['SOURCE_TREE'],
              'linux/' + arch, os.environ['STORE_ID'], '42654961806', '1'):
              raise ValueError('source or artifact binding mismatch')
          with (root / 'image.tar').open('rb') as stream:
              graph = verify_saved_image_file(stream, os.environ['STORE_ID'], 1024**3,
                  platform='linux/' + arch, expected_source=os.environ['SOURCE_SHA'])
          if ([layer['diff_id'] for layer in graph['layers']] != metadata['rootFsDiffIds'] or
              graph['config_digest'] != os.environ['CONFIG_ID'] or graph['manifest_digest'] != os.environ['MANIFEST_ID']):
              raise ValueError('descriptor identity mismatch')
          (root / 'health-evidence' / 'archive-proof.json').write_text(json.dumps({
              'source': os.environ['SOURCE_SHA'], 'tree': os.environ['SOURCE_TREE'],
              'harness': os.environ['GITHUB_SHA'], 'platform': 'linux/' + arch,
              'artifactId': os.environ['ARTIFACT'], 'zipSha256': os.environ['ZIP_SHA'],
              'archiveSha256': os.environ['TAR_SHA'], 'storeId': os.environ['STORE_ID'],
              'configDigest': graph['config_digest'], 'manifestDigest': graph['manifest_digest'],
              'diffIds': metadata['rootFsDiffIds'],
          }, indent=2) + '\n')
          PY
          timeout 120s docker load --input "$RUNNER_TEMP/image.tar"
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          proof = json.loads((root / 'health-evidence' / 'archive-proof.json').read_text())
          image = None
          for identity in (os.environ['STORE_ID'], os.environ['CONFIG_ID']):
              result = subprocess.run(['docker', 'image', 'inspect', identity], capture_output=True, text=True, timeout=15)
              if result.returncode == 0:
                  image = json.loads(result.stdout)[0]
                  break
          if image is None or image['Id'] not in (os.environ['STORE_ID'], os.environ['CONFIG_ID']):
              raise ValueError('loaded image identity mismatch')
          if (image['Os'] + '/' + image['Architecture'] != proof['platform'] or
              image['RootFS']['Layers'] != proof['diffIds'] or
              image['Config']['Labels'].get('org.dollhousemcp.engine-proof-source') != proof['source']):
              raise ValueError('loaded runtime differs from retained evidence')
          expected = ['CMD', '/nodejs/bin/node', '-e', "fetch('http://localhost:'+(process.env.DOLLHOUSE_HTTP_PORT||3000)+'/healthz').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))"]
          if image['Config']['Healthcheck']['Test'] != expected:
              raise ValueError('unexpected health check')
          proof['loadedImageId'] = image['Id']
          (root / 'health-evidence' / 'archive-proof.json').write_text(json.dumps(proof, indent=2) + '\n')
          (root / 'image-id').write_text(image['Id'] + '\n')
          PY
      - name: Run the retained image health check and graceful stop
        shell: bash
        run: |
          set -euo pipefail
          image_id=$(cat "$RUNNER_TEMP/image-id")
          [[ "$image_id" =~ ^sha256:[a-f0-9]{64}$ ]]
          container_id=''
          cleanup() {
            local result=$?
            trap - EXIT
            if [[ -n "$container_id" ]]; then timeout 15s docker rm --force "$container_id" >/dev/null || result=1; fi
            exit "$result"
          }
          trap cleanup EXIT
          container_id=$(timeout 20s docker create --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp:noexec,nosuid,mode=1777 --tmpfs /app/tmp:noexec,nosuid,mode=1777 \
            --tmpfs /app/logs:noexec,nosuid,mode=1777 \
            -e DOLLHOUSE_TRANSPORT=streamable-http -e DOLLHOUSE_HTTP_HOST=127.0.0.1 \
            -e DOLLHOUSE_PORTFOLIO_DIR=/app/tmp/portfolio -e DOLLHOUSE_CACHE_DIR=/app/tmp/cache "$image_id")
          [[ "$container_id" =~ ^[a-f0-9]{64}$ ]]
          test "$(timeout 5s docker inspect --format '{{.Image}}' "$container_id")" = "$image_id"
          test "$(timeout 5s docker inspect --format '{{.Config.User}}' "$container_id")" = '1001:1001'
          timeout 20s docker start "$container_id" >/dev/null
          healthy=false
          for _ in {1..90}; do
            state=$(timeout 5s docker inspect --format '{{.State.Health.Status}}' "$container_id")
            if [[ "$state" = healthy ]]; then healthy=true; break; fi
            if [[ "$state" = unhealthy ]]; then break; fi
            sleep 1
          done
          test "$healthy" = true
          timeout 20s docker stop --time 10 "$container_id" >/dev/null
          test "$(timeout 5s docker inspect --format '{{.State.ExitCode}}' "$container_id")" = 0
          python3 - <<'PY'
          import json, os, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'health-evidence'
          proof = json.loads((root / 'archive-proof.json').read_text())
          proof.update(health='healthy', healthPath='/healthz', network='none', readOnly=True,
                       gracefulStopExitCode=0, status='passed')
          (root / 'health-proof.json').write_text(json.dumps(proof, indent=2) + '\n')
          PY
      - name: Retain native health proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: retained-http-health-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/health-evidence/health-proof.json
          if-no-files-found: error
          retention-days: 1
