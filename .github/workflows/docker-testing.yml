name: Native AMD64 candidate artifact acquisition
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout reviewed driver
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: driver
          persist-credentials: false
      - name: Checkout exact qualified candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: e5449665b24907a3b3b01353ac8bbe0f4f3ee3e6
          path: candidate
          persist-credentials: false
      - name: Serial builds and same-image synthetic OFF proof
        run: python3 driver/scripts/ci/native-amd64-acquire.py "$GITHUB_WORKSPACE/candidate" "$RUNNER_TEMP/native-artifacts"
      - name: Preserve exact images and proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-amd64-e544-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-artifacts/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
