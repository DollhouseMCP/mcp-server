name: Native AMD64 merged release qualification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout reviewed driver
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: driver
          persist-credentials: false
      - name: Checkout exact qualified candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 6c4322d29e05608b91dc0150fcdb804f9069c7b7
          path: candidate
          persist-credentials: false
      - id: acquire
        name: Serial builds and same-image synthetic OFF proof
        run: python3 driver/scripts/ci/native-amd64-acquire.py "$GITHUB_WORKSPACE/candidate" "$RUNNER_TEMP/native-artifacts"
      - name: Scan the exact production image with existing Grype action
        id: image_scan
        if: always() && steps.acquire.outputs.image != ''
        uses: anchore/scan-action@v3
        with:
          image: ${{ steps.acquire.outputs.image }}
          output-format: json
          fail-build: false
          severity-cutoff: high
        continue-on-error: true
      - name: Preserve scan and enforce release audit disposition
        if: always()
        env:
          SCAN_JSON: ${{ steps.image_scan.outputs.json }}
          SCAN_OUTCOME: ${{ steps.image_scan.outcome }}
        run: |
          python3 - <<'PY_AUDIT'
          import pathlib,os,json,shutil,hashlib,collections
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'native-artifacts'
          out.mkdir(exist_ok=True)
          source=pathlib.Path(os.environ.get('SCAN_JSON') or '/nonexistent-native-scan')
          counts={}; available=os.environ.get('SCAN_OUTCOME')=='success' and source.is_file()
          if available:
            shutil.copyfile(source,out/'actual-image-grype.json')
            data=json.loads(source.read_text())
            counts=dict(collections.Counter(x['vulnerability']['severity'] for x in data['matches']))
          result=json.loads((out/'result.json').read_text()) if (out/'result.json').exists() else {'success':False,'failure':'acquisition result unavailable'}
          passed=available and result.get('success') is True and not any(counts.get(x,0) for x in ['High','Critical'])
          (out/'release-audit-result.json').write_text(json.dumps({'qualified':passed,'acquisition':result,'osScanAvailable':available,'osCounts':counts,'requiresExplicitDisposition':not passed},indent=2))
          with (out/'SHA256SUMS').open('w') as checks:
            for f in sorted(out.iterdir()):
              if f.is_file() and f.name!='SHA256SUMS': checks.write(hashlib.file_digest(f.open('rb'),'sha256').hexdigest()+'  '+f.name+'\n')
          if not passed: raise SystemExit('Release image audit or qualification needs explicit disposition; artifact retained')
          PY_AUDIT
      - name: Preserve exact images and proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-amd64-6c4322-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-artifacts/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
