name: Publish MCP Bundle
run-name: Publish MCP Bundle ${{ inputs.correlation_id || github.event.release.tag_name || inputs.tag_name }}

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to upload the bundle to (e.g., v2.0.15)'
        required: true
        type: string
      correlation_id:
        description: 'Optional orchestrator correlation id'
        required: false
        type: string

concurrency:
  group: release-publish-${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  publish-mcpb:
    name: Build and upload .mcpb
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    # Channel consistency (not stable-only): stable versions attach to normal
    # releases; prerelease versions attach ONLY to releases explicitly flagged
    # prerelease — their bundle lands on that prerelease page, an opt-in
    # surface used by the Publish Beta Release flow. Mismatches are refused.
    runs-on: ubuntu-latest
    environment: release-publish

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag_name }}
          fetch-depth: 0

      - name: Verify immutable release source
        shell: bash
        env:
          TAG_NAME: ${{ github.event.release.tag_name || inputs.tag_name }}
        run: |
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/${TAG_NAME}^{commit}")" || {
            echo "::error::Checked-out source does not match ${TAG_NAME}"
            exit 1
          }

      - name: Guard release channel consistency
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_TAG: ${{ github.event.release.tag_name || inputs.tag_name || '' }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease || false }}
        run: |
          # The channel is derived from the VERSION STRING (which nobody can
          # mislabel by accident), then required to agree with the release's
          # prerelease flag and the tag. A beta accidentally released without
          # the prerelease checkbox, or a stable release mislabeled as a
          # prerelease, is refused — but a properly-flagged beta prerelease
          # still gets its .mcpb (the Publish Beta Release contract).
          PACKAGE_VERSION=$(node -p "require('./package.json').version")

          case "${PACKAGE_VERSION}" in
            *-alpha.*|*-beta|*-beta.*|*-rc.*) VERSION_IS_PRERELEASE=true ;;
            *-*)
              echo "::error::Unsupported prerelease suffix in ${PACKAGE_VERSION}; expected -alpha.N, -beta[.N], or -rc.N."
              exit 1
              ;;
            *) VERSION_IS_PRERELEASE=false ;;
          esac

          TAG_IS_PRERELEASE=false
          if [[ -n "${EVENT_TAG}" && "${EVENT_TAG#v}" == *-* ]]; then
            TAG_IS_PRERELEASE=true
          fi
          if [[ -n "${EVENT_TAG}" && "${TAG_IS_PRERELEASE}" != "${VERSION_IS_PRERELEASE}" ]]; then
            echo "::error::Tag ${EVENT_TAG} and package.json version ${PACKAGE_VERSION} disagree about prerelease status."
            exit 1
          fi

          if [[ "${EVENT_NAME}" == "release" ]]; then
            FLAG_IS_PRERELEASE="${RELEASE_PRERELEASE}"
          else
            # Manual dispatch: look up the target release's actual flag.
            FLAG_IS_PRERELEASE=$(gh release view "${EVENT_TAG}" --json isPrerelease --jq '.isPrerelease' 2>/dev/null || echo "unknown")
          fi
          if [[ "${FLAG_IS_PRERELEASE}" == "unknown" ]]; then
            echo "::error::Could not resolve the release for tag '${EVENT_TAG}' to verify its prerelease flag."
            exit 1
          fi
          if [[ "${VERSION_IS_PRERELEASE}" != "${FLAG_IS_PRERELEASE}" ]]; then
            echo "::error::Version ${PACKAGE_VERSION} (prerelease=${VERSION_IS_PRERELEASE}) does not match the release's prerelease flag (${FLAG_IS_PRERELEASE}). Refusing to attach the bundle to a mislabeled release."
            exit 1
          fi

          echo "✅ Channel consistency OK (version ${PACKAGE_VERSION}, tag ${EVENT_TAG:-<none>}, prerelease=${VERSION_IS_PRERELEASE})"

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install pinned MCP bundle CLI
        run: npm install -g --ignore-scripts @anthropic-ai/mcpb@2.1.2

      - name: Resolve release metadata
        id: release_meta
        shell: bash
        env:
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ github.event.inputs.tag_name }}
        run: |
          TAG_NAME="${EVENT_TAG:-$INPUT_TAG}"
          if [ -z "$TAG_NAME" ]; then
            echo "❌ No tag name available for MCP bundle publication"
            exit 1
          fi

          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "❌ Invalid tag format for MCP bundle publication: $TAG_NAME"
            exit 1
          fi

          VERSION=$(node -p "require('./package.json').version")
          EXPECTED_TAG="v${VERSION}"

          if [ "$TAG_NAME" != "$EXPECTED_TAG" ]; then
            echo "❌ Tag/version mismatch: release tag is $TAG_NAME but package.json is $EXPECTED_TAG"
            exit 1
          fi

          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "asset_path=dollhousemcp-${VERSION}.mcpb" >> "$GITHUB_OUTPUT"

      - name: Build MCP bundle
        shell: bash
        run: ./scripts/build-mcpb.sh

      - name: Generate MCP bundle checksum
        id: checksum
        shell: bash
        env:
          ASSET_PATH: ${{ steps.release_meta.outputs.asset_path }}
        run: |
          sha256sum "$ASSET_PATH" > "${ASSET_PATH}.sha256"
          echo "checksum_path=${ASSET_PATH}.sha256" >> "$GITHUB_OUTPUT"

      - name: Attest MCP bundle provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: |
            ${{ steps.release_meta.outputs.asset_path }}
            ${{ steps.checksum.outputs.checksum_path }}

      - name: Upload MCP bundle to GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.release_meta.outputs.tag_name }}
          ASSET_PATH: ${{ steps.release_meta.outputs.asset_path }}
        run: |
          for asset in "$ASSET_PATH" "${ASSET_PATH}.sha256"; do
            success=false
            for attempt in 1 2 3; do
              if gh release upload "$TAG_NAME" "$asset" --clobber; then
                echo "✅ Uploaded $asset"
                success=true
                break
              fi
              echo "⚠️ Upload attempt $attempt failed for $asset"
              sleep 5
            done

            if [[ "$success" != "true" ]]; then
              echo "❌ Failed to upload $asset after 3 attempts"
              exit 1
            fi
          done
