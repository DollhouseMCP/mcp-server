---
name: Onboarding Browser Qualification

on:
  push:
    branches: [main, develop, beta]
  pull_request:
    branches: [main, develop, beta]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-qualification:
    name: Chrome and PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: true
      DOLLHOUSE_TEST_DATABASE_ADMIN_URL: postgres://dollhouse@localhost:5432/postgres

    services:
      postgres:
        image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_USER: dollhouse
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dollhouse -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js 20
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20.x'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify system Chrome
        run: google-chrome --version

      - name: Run onboarding browser qualification
        run: npm run test:onboarding:browser
