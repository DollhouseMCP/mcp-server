name: Security Audit

on:
  push:
    branches: [main, develop, beta]
  pull_request:
    branches: [main, develop, beta]
  schedule:
    # Run daily at 9 AM UTC
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-audit:
    name: Security Audit
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0  # Full history for better analysis
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build project
        run: npm run build

      - name: Run Security Audit
        id: security-audit
        shell: bash
        run: |
          # This job may execute pull-request code, so it intentionally has only
          # contents:read and receives no persisted checkout credential.
          cat > run-audit.js << 'EOF'
          import { SecurityAuditor, SecurityAuditFailure } from './dist/security/audit/index.js';
          import { MarkdownReporter } from './dist/security/audit/reporters/MarkdownReporter.js';
          import { FileOperationsService } from './dist/services/FileOperationsService.js';
          import { FileLockManager } from './dist/security/fileLockManager.js';

          async function runAudit() {
            const fileLockManager = new FileLockManager();
            const fileOperations = new FileOperationsService(fileLockManager);
            const config = await SecurityAuditor.getDefaultConfig(fileOperations);

            config.reporting.formats = ['console', 'markdown', 'json'];
            config.reporting.createIssues = false;
            config.reporting.commentOnPr = false;

            const auditor = new SecurityAuditor(config, fileOperations);

            try {
              let result;
              let auditFailure;
              try {
                result = await auditor.audit();
              } catch (error) {
                if (!(error instanceof SecurityAuditFailure)) throw error;
                auditFailure = error;
                result = error.result;
              }

              const fs = await import('fs/promises');
              await fs.writeFile('security-audit-result.json', JSON.stringify(result, null, 2));

              const markdownReporter = new MarkdownReporter(result);
              await fs.writeFile('security-audit-report.md', markdownReporter.generate());

              if (auditFailure || result.summary.bySeverity.critical > 0 || result.summary.bySeverity.high > 0) {
                process.exitCode = 1;
              }
            } catch (error) {
              console.error('Security audit failed:', error);
              process.exitCode = 1;
            }
          }

          runAudit();
          EOF

          AUDIT_FAILED=false
          if ! node run-audit.js; then
            AUDIT_FAILED=true
            echo "::warning::Security audit encountered errors; preserving the complete result before failing"
            if [[ ! -s security-audit-result.json ]]; then
              echo '{"findings": [], "summary": {"total": 0, "bySeverity": {"critical": 0, "high": 0, "medium": 0, "low": 0}}, "error": "Audit failed to complete"}' > security-audit-result.json
            fi
          fi

          printf '%s\n' "${AUDIT_FAILED}" > security-audit-status.txt
          echo "AUDIT_FAILED=${AUDIT_FAILED}" >> "$GITHUB_ENV"

      - name: Upload audit results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: security-audit-results
          path: |
            security-audit-report.md
            security-audit-report.json
            security-audit-result.json
            security-audit-status.txt
          retention-days: 7

      - name: Fail if high-severity issues were found
        if: env.AUDIT_FAILED == 'true'
        shell: bash
        run: |
          echo "Security audit found high-severity issues. Review the preserved artifact."
          exit 1

  trusted-report:
    name: Publish trusted security report
    needs: security-audit
    if: >-
      ${{
        always() &&
        github.event_name != 'pull_request' &&
        (
          github.event_name != 'workflow_dispatch' ||
          github.ref == 'refs/heads/main' ||
          github.ref == 'refs/heads/develop' ||
          github.ref == 'refs/heads/beta'
        )
      }}
    permissions:
      actions: read
      contents: read
      issues: write
      security-events: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # This job never checks out or executes repository code. It only parses the
      # scanner's JSON artifact from trusted push/schedule/manual workflow runs.
      - name: Download audit results
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: security-audit-results

      - name: Read audit status
        shell: bash
        run: |
          test -s security-audit-status.txt
          AUDIT_FAILED="$(cat security-audit-status.txt)"
          if [[ "${AUDIT_FAILED}" != "true" && "${AUDIT_FAILED}" != "false" ]]; then
            echo "::error::Invalid security audit status artifact"
            exit 1
          fi
          echo "AUDIT_FAILED=${AUDIT_FAILED}" >> "$GITHUB_ENV"

      - name: Generate SARIF report
        shell: bash
        run: |
          cat > convert-to-sarif.js << 'EOF'
          import { readFile, writeFile } from 'fs/promises';

          function mapSeverityToLevel(severity) {
            switch (severity) {
              case 'critical':
              case 'high':
                return 'error';
              case 'medium':
                return 'warning';
              default:
                return 'note';
            }
          }

          const result = JSON.parse(await readFile('security-audit-result.json', 'utf-8'));
          const sarif = {
            version: '2.1.0',
            runs: [{
              tool: {
                driver: {
                  name: 'DollhouseMCP Security Audit',
                  version: '1.0.0',
                  rules: []
                }
              },
              results: result.findings.map(finding => ({
                ruleId: finding.ruleId,
                level: mapSeverityToLevel(finding.severity),
                message: { text: finding.message },
                locations: finding.file ? [{
                  physicalLocation: {
                    artifactLocation: { uri: finding.file },
                    region: {
                      startLine: finding.line || 1,
                      startColumn: finding.column || 1
                    }
                  }
                }] : []
              }))
            }]
          };

          await writeFile('security-audit.sarif', JSON.stringify(sarif, null, 2));
          EOF

          node convert-to-sarif.js

      - name: Upload SARIF to GitHub
        if: github.event.repository.private == false
        uses: github/codeql-action/upload-sarif@b56ba49b26e50535fa1e7f7db0f4f7b4bf65d80d # v3.28.10
        with:
          sarif_file: security-audit.sarif
          category: security-audit

      - name: Create issues for critical findings
        if: github.event_name == 'schedule' && env.AUDIT_FAILED == 'true'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const fs = require('fs');
            const result = JSON.parse(fs.readFileSync('security-audit-result.json', 'utf8'));
            const criticalFindings = result.findings.filter(f => f.severity === 'critical');

            for (const finding of criticalFindings.slice(0, 5)) {
              const title = `Security: ${finding.message}`;
              const body = `## Security Issue Detected

              **Rule**: ${finding.ruleId}
              **Severity**: ${finding.severity}
              **File**: ${finding.file || 'N/A'}
              **Line**: ${finding.line || 'N/A'}

              ### Description
              ${finding.message}

              ### Remediation
              ${finding.remediation}

              ---
              *This issue was automatically created by the Security Audit workflow.*`;

              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['security', 'automated', 'priority: critical']
              });
            }
