---
name: Extended Node Compatibility

on:
  push:
    branches: [main, develop, beta]
  pull_request:
    branches: [main, develop, beta]
  schedule:
    - cron: '0 6 * * 1'  # Weekly on Monday 6 AM UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_OPTIONS: '--max-old-space-size=4096 --experimental-vm-modules'
  CI: true
  PORTFOLIO_REPOSITORY_NAME: dollhouse-portfolio
  TEST_PERSONAS_DIR: ${{ github.workspace }}/test-personas
  # TEST_GITHUB_TOKEN removed - not used in workflow steps, causes PR fork issues

jobs:
  extended-compatibility:
    name: Extended (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: ['20.x', '22.x']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fetch tags for signature verification
        shell: bash
        run: git fetch --tags --force

      - name: Validate environment
        # Use bash for cross-platform compatibility (Windows/macOS/Linux)
        shell: bash
        run: |
          echo "🔍 Validating CI environment..."
          echo "TEST_PERSONAS_DIR: $TEST_PERSONAS_DIR"
          echo "NODE_OPTIONS: $NODE_OPTIONS"
          echo "CI: $CI"

          # Verify TEST_PERSONAS_DIR is set
          if [ -z "$TEST_PERSONAS_DIR" ]; then
            echo "❌ TEST_PERSONAS_DIR is not set!"
            exit 1
          fi

          # Display workspace info for debugging
          echo "GitHub workspace: ${{ github.workspace }}"
          echo "Runner OS: ${{ runner.os }}"
          echo "Current directory: $(pwd)"

          echo "✅ Environment validation passed"

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Cache TypeScript build
        uses: actions/cache@v4
        with:
          path: |
            dist/
            build/
            *.tsbuildinfo
          key: typescript-build-${{ runner.os }}-${{ matrix.node-version }}-${{ hashFiles('src/**/*.ts', 'tsconfig*.json', 'package.json', 'package-lock.json') }}
          # REMOVED restore-keys to prevent using stale caches with old compiled code
          # This ensures we always rebuild when source files change

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build project
        run: npm run build

      - name: Cache Jest
        uses: actions/cache@v4
        with:
          path: |
            .jest-cache/
            test/coverage/
            node_modules/.cache/jest/
          key: jest-cache-${{ runner.os }}-${{ matrix.node-version }}-${{ hashFiles('test/__tests__/**/*.ts', 'test/jest.config.*', 'src/**/*.ts', 'package.json', 'package-lock.json') }}
          # REMOVED restore-keys for consistency with TypeScript cache fix
          # Jest cache can also become stale and cause test failures

      - name: Run ordinary unit matrix
        id: original_tests
        # Preserve npm test's VM flags and full-suite timing-selection signal.
        env:
          NODE_OPTIONS: '${{ env.NODE_OPTIONS }} --experimental-vm-modules --no-warnings'
          npm_lifecycle_script: 'cross-env "NODE_OPTIONS=$NODE_OPTIONS --experimental-vm-modules --no-warnings" jest --config tests/jest.config.cjs'
        run: node node_modules/jest/bin/jest.js --config tests/jest.config.cjs --testPathPatterns='^(?!.*(?:^|/)(?:FileMemoryOwnedCreate|FileMemoryArchiveCleanupCapacity|FileMemoryOwnedRename|FileMemoryOwnedDeleteCapacity)[.]test[.]ts$).*'
        continue-on-error: true

      # Keep the complete filesystem capacity suite in a fresh serial process.
      - name: Run required CREATE capacity suite
        id: create_tests
        run: npm test -- --runInBand --runTestsByPath tests/unit/storage/FileMemoryOwnedCreate.test.ts
        continue-on-error: true

      # Keep all cleanup capacity cases and their whole-case deadlines in a fresh process.
      - name: Run required archive cleanup capacity suite
        id: cleanup_tests
        run: npm test -- --runInBand --runTestsByPath tests/unit/storage/FileMemoryArchiveCleanupCapacity.test.ts
        continue-on-error: true

      # Preserve the complete managed RENAME suite and its deadlines in a fresh process.
      - name: Run required managed RENAME suite
        id: rename_tests
        run: npm test -- --runInBand --runTestsByPath tests/unit/storage/FileMemoryOwnedRename.test.ts
        continue-on-error: true

      # DELETE's populated filesystem proofs retain all cases and deadlines in a fresh process.
      - name: Run required head DELETE capacity suite
        id: delete_tests
        run: npm test -- --runInBand --runTestsByPath tests/unit/storage/FileMemoryOwnedDeleteCapacity.test.ts
        continue-on-error: true

      - name: Enforce all required test groups
        if: always()
        shell: bash
        env:
          TEST_OUTCOME: ${{ steps.original_tests.outcome }}
          CREATE_OUTCOME: ${{ steps.create_tests.outcome }}
          CLEANUP_OUTCOME: ${{ steps.cleanup_tests.outcome }}
          RENAME_OUTCOME: ${{ steps.rename_tests.outcome }}
          DELETE_OUTCOME: ${{ steps.delete_tests.outcome }}
        run: |
          if [ "$TEST_OUTCOME" != "success" ] || [ "$CREATE_OUTCOME" != "success" ] || [ "$CLEANUP_OUTCOME" != "success" ] || [ "$RENAME_OUTCOME" != "success" ] || [ "$DELETE_OUTCOME" != "success" ]; then
            echo "Ordinary unit, CREATE capacity, archive cleanup capacity, managed RENAME and head DELETE capacity groups must all pass compatibility validation."
            exit 1
          fi

      - name: Compatibility validation
        run: |
          echo "✅ Extended Node Compatibility Complete!"
          echo "Platform: ${{ matrix.os }}"
          echo "Node.js: ${{ matrix.node-version }}"

      - name: Notify on scheduled failure
        if: failure() && github.event_name == 'schedule'
        run: |
          echo "🚨 Extended Node Compatibility failed on scheduled run"
          echo "This indicates a potential compatibility issue with Node.js ${{ matrix.node-version }} on ${{ matrix.os }}"
          echo "Please investigate: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
