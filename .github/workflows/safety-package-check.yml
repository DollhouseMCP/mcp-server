---
name: Safety Package Version Check

on:
  pull_request:
    branches: [main, develop, beta]
    paths:
      - 'packages/safety/src/**'
      - 'packages/safety/package.json'
      - 'scripts/check-safety-package-version.mjs'
      - '.github/workflows/safety-package-check.yml'

permissions:
  contents: read

jobs:
  check-safety-version:
    name: Safety Package Version Check
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - uses: actions/checkout@v4
        with:
          # The helper verifies a published gitHead against the trusted main
          # history instead of trusting pull request metadata or fork refs.
          fetch-depth: 0

      - name: Check if safety package needs publishing
        run: node scripts/check-safety-package-version.mjs
