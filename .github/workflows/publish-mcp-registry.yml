name: Publish to MCP Registry

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_ref:
        description: 'Optional git ref to publish (for example refs/tags/v2.0.15)'
        required: false
        type: string
      dry_run:
        description: 'Run in dry-run mode (test without publishing)'
        required: false
        type: boolean
        default: false

concurrency:
  group: release-publish-${{ github.workflow }}
  cancel-in-progress: false

permissions:
  id-token: write  # Required for OIDC authentication
  contents: read   # Required for checkout

jobs:
  publish:
    if: >-
      (github.event_name != 'release' || github.event.release.prerelease != true) &&
      (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: release-publish

    steps:
      - name: Resolve and validate source ref
        id: source-ref
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_RELEASE_REF: ${{ github.event.inputs.release_ref || '' }}
          RELEASE_TAG_NAME: ${{ github.event.release.tag_name || '' }}
          EVENT_REF: ${{ github.ref }}
        run: |
          RAW_REF=""

          if [[ "${EVENT_NAME}" == "workflow_dispatch" && -n "${INPUT_RELEASE_REF}" ]]; then
            RAW_REF="${INPUT_RELEASE_REF}"
          elif [[ "${EVENT_NAME}" == "release" ]]; then
            RAW_REF="refs/tags/${RELEASE_TAG_NAME}"
          else
            RAW_REF="${EVENT_REF}"
          fi

          if [[ "$RAW_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][A-Za-z0-9._-]+)?$ ]]; then
            RAW_REF="refs/tags/${RAW_REF}"
          fi

          if [[ ! "$RAW_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+([-.][A-Za-z0-9._-]+)?$ && ! "$RAW_REF" =~ ^refs/heads/[A-Za-z0-9._/-]+$ ]]; then
            echo "::error::Unsupported release ref '$RAW_REF'. Use refs/tags/vX.Y.Z, vX.Y.Z, or a refs/heads/* branch."
            exit 1
          fi

          echo "ref=$RAW_REF" >> "$GITHUB_OUTPUT"

      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ steps.source-ref.outputs.ref }}

      - name: Verify immutable live release source
        if: ${{ github.event.inputs.dry_run != 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REF: ${{ steps.source-ref.outputs.ref }}
        run: |
          set -euo pipefail

          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          EXPECTED_TAG="v${PACKAGE_VERSION}"
          if [[ "${SOURCE_REF}" != "refs/tags/${EXPECTED_TAG}" ]]; then
            echo "::error::Live MCP Registry publication requires immutable source refs/tags/${EXPECTED_TAG}; got ${SOURCE_REF}"
            exit 1
          fi

          HEAD_COMMIT="$(git rev-parse HEAD)"
          TAG_COMMIT="$(git rev-parse "refs/tags/${EXPECTED_TAG}^{commit}")"
          test "${HEAD_COMMIT}" = "${TAG_COMMIT}" || {
            echo "::error::Checked-out source does not match ${EXPECTED_TAG}"
            exit 1
          }

          release_json=$(gh release view "${EXPECTED_TAG}" --json tagName,isDraft,isPrerelease,targetCommitish)
          test "$(jq -r '.tagName' <<<"${release_json}")" = "${EXPECTED_TAG}" || exit 1
          test "$(jq -r '.isDraft' <<<"${release_json}")" = "false" || {
            echo "::error::Live MCP Registry publication requires a published GitHub release"
            exit 1
          }
          test "$(jq -r '.isPrerelease' <<<"${release_json}")" = "false" || {
            echo "::error::The MCP Registry stable channel cannot publish a GitHub prerelease"
            exit 1
          }

      - name: Guard stable channel (version string, not just release flag)
        shell: bash
        env:
          SOURCE_REF: ${{ steps.source-ref.outputs.ref }}
        run: |
          # Belt-and-braces on top of the job-level prerelease-flag check: a
          # beta tag released with the prerelease checkbox unset, or a manual
          # workflow_dispatch rerun with release_ref=refs/tags/v2.1.0-beta.1,
          # must still be refused. The MCP Registry lists stable builds only.
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          TAG_PART="${SOURCE_REF#refs/tags/v}"
          for candidate in "${PACKAGE_VERSION}" "${TAG_PART}"; do
            if [[ -n "${candidate}" && "${candidate}" != refs/* && "${candidate}" == *-* ]]; then
              echo "::error::Refusing to publish prerelease '${candidate}' to the MCP Registry (package.json: ${PACKAGE_VERSION}, ref: ${SOURCE_REF}). Stable releases only."
              exit 1
            fi
          done
          echo "✅ Stable channel confirmed (version ${PACKAGE_VERSION}, ref ${SOURCE_REF})"

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build package
        run: npm run build

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # Pinned to cosign-installer v4.1.2 so Cosign v3 releases are verified
          # with Sigstore bundles instead of deprecated detached .sig assets.
          # See https://github.com/sigstore/cosign-installer/issues/202.
          cosign-release: 'v3.0.6'

      - name: Download mcp-publisher CLI
        shell: bash
        run: |
          set -euo pipefail

          # Pinned for reproducibility. v1.3.3 used the retired shared OIDC
          # audience ("mcp-registry"); current registry auth expects the
          # registry URL as the audience. When bumping this CLI, update
          # VERSION, ARCHIVE, EXPECTED_SHA256, and the Sigstore identity
          # expectation from the same upstream release.
          VERSION="v1.7.9"
          ARCHIVE="mcp-publisher_linux_amd64.tar.gz"
          EXPECTED_SHA256="ab128162b0616090b47cf245afe0a23f3ef08936fdce19074f5ba0a4469281ac"
          ARCHIVE_FILE="/tmp/mcp-publisher.tar.gz"
          BUNDLE_FILE="/tmp/mcp-publisher.tar.gz.sigstore.json"
          EXPECTED_IDENTITY="https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${VERSION}"
          EXPECTED_ISSUER="https://token.actions.githubusercontent.com"

          # Download archive and signature material.
          curl --proto '=https' --proto-redir '=https' --retry 3 --retry-delay 5 -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/${VERSION}/${ARCHIVE}" -o "$ARCHIVE_FILE"
          curl --proto '=https' --proto-redir '=https' --retry 3 --retry-delay 5 -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/${VERSION}/${ARCHIVE}.sigstore.json" -o "$BUNDLE_FILE"

          # Verify the pinned archive digest first for deterministic release inputs.
          if ! echo "${EXPECTED_SHA256}  ${ARCHIVE_FILE}" | sha256sum --check --status; then
            echo "::error::SHA256 verification failed for ${ARCHIVE}"
            exit 1
          fi

          # Verify the upstream Sigstore bundle is tied to the MCP Registry
          # release workflow for the pinned tag.
          cosign verify-blob \
            --bundle "$BUNDLE_FILE" \
            --certificate-identity "$EXPECTED_IDENTITY" \
            --certificate-oidc-issuer "$EXPECTED_ISSUER" \
            "$ARCHIVE_FILE"

          # Extract and install
          tar -xzf "$ARCHIVE_FILE" -C /tmp mcp-publisher
          chmod +x /tmp/mcp-publisher
          sudo mv /tmp/mcp-publisher /usr/local/bin/mcp-publisher

      - name: Verify mcp-publisher installation
        run: mcp-publisher --version

      - name: Login to MCP Registry (OIDC)
        run: mcp-publisher login github-oidc

      - name: Wait for npm package propagation
        if: ${{ github.event.inputs.dry_run != 'true' && startsWith(steps.source-ref.outputs.ref, 'refs/tags/') }}
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          MAX_ATTEMPTS=20
          SLEEP_SECONDS=30

          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            if PUBLISHED_VERSION="$(npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version --registry https://registry.npmjs.org --silent 2>/dev/null)" \
              && [[ "$PUBLISHED_VERSION" == "$PACKAGE_VERSION" ]]; then
              echo "Detected ${PACKAGE_NAME}@${PACKAGE_VERSION} on npm."
              exit 0
            fi

            if [[ "$attempt" -eq "$MAX_ATTEMPTS" ]]; then
              break
            fi

            echo "Waiting for ${PACKAGE_NAME}@${PACKAGE_VERSION} to propagate to npm (${attempt}/${MAX_ATTEMPTS})..."
            sleep "$SLEEP_SECONDS"
          done

          echo "::error::Timed out waiting for ${PACKAGE_NAME}@${PACKAGE_VERSION} to appear on npm. Rerun the workflow after npm propagation completes."
          exit 1

      - name: Publish to MCP Registry
        shell: bash
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run || false }}
        run: |
          if [ "${DRY_RUN}" == "true" ]; then
            echo "Running in DRY-RUN mode"
            mcp-publisher publish --dry-run
          else
            mcp-publisher publish
          fi
